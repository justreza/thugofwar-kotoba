<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Horse Racing: Kanji Duel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            margin: 0;
            padding: 10px 20px;
            min-height: 100vh;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .screen { display: none; animation: fadeIn 0.5s ease-in-out; }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            max-width: 1000px;
            margin: 20px auto;
        }

        h1 { 
            font-size: 34px; 
            margin-bottom: 5px; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
        }
        .subtitle { color: #94a3b8; font-weight: 600; letter-spacing: 3px; margin-bottom: 30px; font-size: 14px; }

        .menu-btn {
            font-family: 'Poppins', sans-serif;
            padding: 16px 36px;
            margin: 10px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-n5 { background: linear-gradient(45deg, #10b981, #059669); box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .btn-n4 { background: linear-gradient(45deg, #3b82f6, #2563eb); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .btn-n3 { background: linear-gradient(45deg, #ef4444, #dc2626); box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .btn-gray { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-orange { background: linear-gradient(45deg, #f59e0b, #d97706); box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
        
        .menu-btn:hover { transform: translateY(-3px) scale(1.05); filter: brightness(1.2); }
        .menu-btn:active { transform: translateY(0) scale(1); }

        #arena-container {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .boundary-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 4px;
            z-index: 1;
        }
        .left-line { left: 10%; background: #3b82f6; box-shadow: 0 0 15px #3b82f6, 0 0 30px #3b82f6; }
        .right-line { right: 10%; background: #ef4444; box-shadow: 0 0 15px #ef4444, 0 0 30px #ef4444; }
        .center-line { left: 50%; transform: translateX(-50%); width: 2px; background: rgba(255,255,255,0.3); }

        #tug-group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .rope {
            position: absolute;
            left: 70px; right: 70px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            z-index: -1;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .horse-icon {
            width: 75px; height: 75px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 42px; /* Disesuaikan agar tidak terpotong border */
            line-height: 1;
            user-select: none;
            box-sizing: border-box;
            padding-bottom: 5px; /* Menyesuaikan posisi tengah emoji */
        }
        
        /* Pemain 1 (Kiri) lari ke arah kiri -> Emoji Default menghadap kiri */
        .player-horse { 
            border: 3px solid #3b82f6; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), inset 0 0 12px rgba(59, 130, 246, 0.4);
            transform: scaleX(1); 
        }
        
        /* Pemain 2 (Kanan) lari ke arah kanan -> Emoji di-flip menghadap kanan */
        .enemy-horse { 
            border: 3px solid #ef4444; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6), inset 0 0 12px rgba(239, 68, 68, 0.4);
            transform: scaleX(-1);
        }

        #kanji-target {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 90px;
            font-weight: 900;
            color: #ffffff;
            margin: 15px 0;
            text-shadow: 0 0 25px rgba(255,255,255,0.8), 0 0 45px rgba(255,255,255,0.4);
        }

        .duel-container {
            display: flex;
            justify-content: space-between;
            gap: 25px;
            width: 100%;
        }

        .player-board {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 20px;
        }
        .p1-board { box-shadow: inset 0 4px 20px rgba(59, 130, 246, 0.15); }
        .p2-board { box-shadow: inset 0 4px 20px rgba(239, 68, 68, 0.15); }

        .board-title { font-size: 18px; font-weight: 800; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;}
        .p1-title { color: #3b82f6; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
        .p2-title { color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.5); }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            font-family: 'Noto Sans JP', 'Poppins', sans-serif;
            padding: 18px 12px;
            font-size: 22px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #f8fafc;
        }
        
        .option-btn:hover { background: rgba(255, 255, 255, 0.12); }
        .p1-board .option-btn:active { background: rgba(59, 130, 246, 0.4); border-color: #3b82f6; transform: scale(0.95); }
        .p2-board .option-btn:active { background: rgba(239, 68, 68, 0.4); border-color: #ef4444; transform: scale(0.95); }
        
        .meaning-text {
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            max-width: 1000px;
            margin: 25px auto 0 auto;
        }

        #result-message { 
            font-size: 45px; 
            font-weight: 900; 
            margin-bottom: 35px; 
            text-shadow: 0 0 25px currentColor; 
        }

        @media (max-width: 768px) {
            .duel-container { flex-direction: column; }
            .options-grid { grid-template-columns: 1fr 1fr; }
            #kanji-target { font-size: 70px; }
            .glass-panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- SCREEN: MENU -->
    <div id="menu-screen" class="screen active">
        <div class="glass-panel">
            <h1>Neon Horse Racing</h1>
            <p class="subtitle">KANJI DUEL ARENA</p>
            <p style="font-size: 16px; color: #cbd5e1; margin-bottom: 45px; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.7;">
                Pemain 1 (Kiri) vs Pemain 2 (Kanan). Jawab dengan tepat lebih cepat dari lawanmu untuk memacu kudamu ke garis finis.
            </p>
            <button class="menu-btn btn-n5" onclick="startGame('N5')">Duel Level N5</button>
            <button class="menu-btn btn-n4" onclick="startGame('N4')">Duel Level N4</button>
            <button class="menu-btn btn-n3" onclick="startGame('N3')">Duel Level N3</button>
        </div>
    </div>

    <!-- SCREEN: GAME -->
    <div id="game-screen" class="screen">
        <h2 id="level-indicator" style="color: #94a3b8; font-size: 18px; letter-spacing: 3px; font-weight: 800; margin-bottom: 15px;">LEVEL --</h2>
        
        <div class="glass-panel" style="padding: 25px;">
            <div id="arena-container">
                <div class="boundary-line left-line"></div>
                <div class="boundary-line center-line"></div>
                <div class="boundary-line right-line"></div>
                
                <div id="tug-group">
                    <!-- Kuda saling membelakangi -->
                    <div class="horse-icon player-horse">🏇</div>
                    <div class="rope"></div>
                    <div class="horse-icon enemy-horse">🏇</div>
                </div>
            </div>

            <div id="kanji-target">日</div>

            <div class="duel-container">
                <!-- Papan Pemain 1 -->
                <div class="player-board p1-board">
                    <div class="board-title p1-title">Pemain 1 (Kuda Biru)</div>
                    <div class="options-grid" id="p1-options-container"></div>
                </div>

                <!-- Papan Pemain 2 -->
                <div class="player-board p2-board">
                    <div class="board-title p2-title">Pemain 2 (Kuda Merah)</div>
                    <div class="options-grid" id="p2-options-container"></div>
                </div>
            </div>
        </div>

        <!-- Panel Kontrol: Reset Kiri, Selesai Kanan -->
        <div class="control-panel">
            <button class="menu-btn btn-gray" onclick="resetGame()">Reset</button>
            <button class="menu-btn btn-orange" onclick="backToMenu()">Selesai</button>
        </div>
    </div>

    <!-- SCREEN: RESULT -->
    <div id="result-screen" class="screen">
        <div class="glass-panel">
            <div id="result-message"></div>
            <button class="menu-btn btn-gray" onclick="backToMenu()">Kembali ke Menu</button>
            <button class="menu-btn btn-n4" onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

            { kanji: '残', reading: 'ザン / のこる', meaning: 'Sisa / Meninggalkan', level: 'N3' },

            { kanji: '期', reading: 'キ / ゴ', meaning: 'Periode / Jangka Waktu', level: 'N3' },

            { kanji: '議', reading: 'ギ', meaning: 'Rapat / Diskusi', level: 'N3' },
            { kanji: '求', reading: 'キュウ / もとめる', meaning: 'Meminta / Menuntut', level: 'N3' },
            { kanji: '球', reading: 'キュウ / たま', meaning: 'Bola / Benda Bulat', level: 'N3' },
            { kanji: '給', reading: 'キュウ', meaning: 'Gaji / Upah / Pasokan', level: 'N3' },
            { kanji: '決', reading: 'ケツ / きめる', meaning: 'Memutuskan / Menetapkan', level: 'N3' },
            { kanji: '結', reading: 'ケツ / むすぶ', meaning: 'Ikat / Hubung / Hasil', level: 'N3' },
            { kanji: '件', reading: 'ケン', meaning: 'Kasus / Masalah', level: 'N3' },
            { kanji: '権', reading: 'ケン / ゴン', meaning: 'Hak / Kekuasaan', level: 'N3' },
            { kanji: '呼', reading: 'コ / よぶ', meaning: 'Memanggil / Bernapas', level: 'N3' }
        ];

        let currentData = [];
        let currentQuestion = null;
        let scorePosition = 0; 
        const MAX_STEPS = 6; 
        let isAnswering = false;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame(level) {
            currentData = kanjiDatabase.filter(k => k.level === level);
            document.getElementById('level-indicator').innerText = `DUEL LEVEL ${level}`;
            scorePosition = 0;
            updateArena();
            switchScreen('game-screen');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isAnswering = false;
            const correctIndex = Math.floor(Math.random() * currentData.length);
            currentQuestion = currentData[correctIndex];

            let wrongOptions = currentData.filter((_, idx) => idx !== correctIndex);
            wrongOptions.sort(() => 0.5 - Math.random()); 
            wrongOptions = wrongOptions.slice(0, 3);

            let allOptions = [currentQuestion, ...wrongOptions];
            allOptions.sort(() => 0.5 - Math.random());

            document.getElementById('kanji-target').innerText = currentQuestion.kanji;
            
            const p1Container = document.getElementById('p1-options-container');
            const p2Container = document.getElementById('p2-options-container');
            
            p1Container.innerHTML = '';
            p2Container.innerHTML = '';
            
            allOptions.forEach(opt => {
                const btn1 = document.createElement('button');
                btn1.className = 'option-btn';
                btn1.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn1.onclick = () => handleAnswer(1, opt.kanji);
                p1Container.appendChild(btn1);

                const btn2 = document.createElement('button');
                btn2.className = 'option-btn';
                btn2.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn2.onclick = () => handleAnswer(2, opt.kanji);
                p2Container.appendChild(btn2);
            });
        }

        function handleAnswer(player, selectedKanji) {
            if (isAnswering) return; 
            isAnswering = true;

            const isCorrect = (selectedKanji === currentQuestion.kanji);

            if (player === 1) {
                scorePosition += isCorrect ? -1 : 1; 
            } else if (player === 2) {
                scorePosition += isCorrect ? 1 : -1;
            }

            updateArena();

            if (scorePosition <= -MAX_STEPS) {
                setTimeout(() => endGame(1), 400); 
            } else if (scorePosition >= MAX_STEPS) {
                setTimeout(() => endGame(2), 400);
            } else {
                setTimeout(loadNextQuestion, 250);
            }
        }

        function updateArena() {
            const tugGroup = document.getElementById('tug-group');
            const stepPercentage = 40 / MAX_STEPS; 
            const newLeft = 50 + (scorePosition * stepPercentage); 
            tugGroup.style.left = `${newLeft}%`;
        }

        function endGame(winner) {
            switchScreen('result-screen');
            const resultMsg = document.getElementById('result-message');
            if (winner === 1) {
                resultMsg.innerText = "🏁 PEMAIN 1 (BIRU) MENANG! 🏁";
                resultMsg.style.color = "#3b82f6";
            } else {
                resultMsg.innerText = "🏁 PEMAIN 2 (MERAH) MENANG! 🏁";
                resultMsg.style.color = "#ef4444";
            }
        }

        function resetGame() {
            if (currentData.length > 0) {
                startGame(currentData[0].level);
            } else {
                switchScreen('menu-screen');
            }
        }

        function backToMenu() {
            switchScreen('menu-screen');
        }
    </script>
