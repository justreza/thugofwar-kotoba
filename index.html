<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Horse Racing: Kanji Duel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            margin: 0;
            padding: 10px 20px;
            min-height: 100vh;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .screen { display: none; animation: fadeIn 0.5s ease-in-out; }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            max-width: 1000px;
            margin: 20px auto;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .form-input:focus, .form-select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }
        .form-select option {
            background: #1e1b4b;
            color: #ffffff;
        }

        .menu-btn {
            font-family: 'Poppins', sans-serif;
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00dbde, #fc00ff);
            box-shadow: 0 0 20px rgba(0, 219, 222, 0.4);
        }
        .menu-btn:hover { transform: translateY(-3px) scale(1.02); filter: brightness(1.2); }
        .menu-btn:active { transform: translateY(0) scale(1); }

        .btn-gray { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); width: auto; padding: 12px 30px; }
        .btn-orange { background: linear-gradient(45deg, #f59e0b, #d97706); box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); width: auto; padding: 12px 30px; }

        #arena-container {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .boundary-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 4px;
            z-index: 1;
        }
        .left-line { left: 10%; background: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        .right-line { right: 10%; background: #ef4444; box-shadow: 0 0 15px #ef4444; }
        .center-line { left: 50%; transform: translateX(-50%); width: 2px; background: rgba(255,255,255,0.3); }

        #tug-group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .rope {
            position: absolute;
            left: 70px; right: 70px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            z-index: -1;
        }

        .horse-icon {
            width: 75px; height: 75px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 42px;
            line-height: 1;
            user-select: none;
            box-sizing: border-box;
            padding-bottom: 5px;
        }
        
        .player-horse { 
            border: 3px solid #3b82f6; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            transform: scaleX(1); 
        }
        
        .enemy-horse { 
            border: 3px solid #ef4444; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            transform: scaleX(-1);
        }

        .game-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .timer-box {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            color: #fca5a5;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }

        /* Perbaikan Kontras Kanji & Glowing */
        #kanji-target {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 85px;
            font-weight: 900;
            color: #ffffff;
            margin: 10px 0;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 40%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.6));
        }

        .duel-container {
            display: flex;
            justify-content: space-between;
            gap: 25px;
            width: 100%;
        }

        .player-board {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 20px;
        }
        .p1-board { box-shadow: inset 0 4px 20px rgba(59, 130, 246, 0.15); }
        .p2-board { box-shadow: inset 0 4px 20px rgba(239, 68, 68, 0.15); }

        .board-title { font-size: 16px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        .p1-title { color: #3b82f6; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
        .p2-title { color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.5); }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            font-family: 'Noto Sans JP', 'Poppins', sans-serif;
            padding: 15px 10px;
            font-size: 20px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #f8fafc;
        }
        
        .option-btn:hover { background: rgba(255, 255, 255, 0.12); }
        .p1-board .option-btn:active { background: rgba(59, 130, 246, 0.4); border-color: #3b82f6; transform: scale(0.95); }
        .p2-board .option-btn:active { background: rgba(239, 68, 68, 0.4); border-color: #ef4444; transform: scale(0.95); }
        
        .meaning-text {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            max-width: 1000px;
            margin: 25px auto 0 auto;
        }

        #result-message { 
            font-size: 38px; 
            font-weight: 900; 
            margin-bottom: 30px; 
            text-shadow: 0 0 25px currentColor; 
            text-align: center;
        }

        @media (max-width: 768px) {
            .duel-container { flex-direction: column; }
            .options-grid { grid-template-columns: 1fr 1fr; }
            #kanji-target { font-size: 65px; }
            .glass-panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- SCREEN: MENU -->
    <div id="menu-screen" class="screen active">
        <div class="glass-panel" style="max-width: 500px;">
            <h2 style="font-size: 24px; text-align: center; margin-bottom: 25px; letter-spacing: 1px;">Persiapan Balapan</h2>
            
            <div class="form-group">
                <label class="form-label">Mode Balapan:</label>
                <select id="game-level" class="form-select">
                    <option value="N5">Mode Kanji N5</option>
                    <option value="N4">Mode Kanji N4</option>
                    <option value="N3">Mode Kanji N3</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Rider 1:</label>
                <input type="text" id="player1-name" class="form-input" placeholder="Masukkan nama rider 1..." value="Pemain 1">
            </div>

            <div class="form-group">
                <label class="form-label">Rider 2:</label>
                <input type="text" id="player2-name" class="form-input" placeholder="Masukkan nama rider 2..." value="Pemain 2">
            </div>

            <button class="menu-btn" onclick="initGameSession()">Mulai Balapan!</button>
        </div>
    </div>

    <!-- SCREEN: GAME -->
    <div id="game-screen" class="screen">
        <div class="game-header-info" style="max-width: 1000px; margin: 0 auto 10px auto;">
            <div id="level-indicator" style="color: #94a3b8; font-size: 14px; letter-spacing: 2px; font-weight: 800;">LEVEL --</div>
            <div class="timer-box" id="timer-display">⏱️ 06s</div>
        </div>
        
        <div class="glass-panel" style="padding: 25px;">
            <div id="arena-container">
                <div class="boundary-line left-line"></div>
                <div class="boundary-line center-line"></div>
                <div class="boundary-line right-line"></div>
                
                <div id="tug-group">
                    <div class="horse-icon player-horse">🏇</div>
                    <div class="rope"></div>
                    <div class="horse-icon enemy-horse">🏇</div>
                </div>
            </div>

            <div id="kanji-target">日</div>

            <div class="duel-container">
                <!-- Papan Pemain 1 -->
                <div class="player-board p1-board">
                    <div class="board-title p1-title" id="p1-title-label">Pemain 1</div>
                    <div class="options-grid" id="p1-options-container"></div>
                </div>

                <!-- Papan Pemain 2 -->
                <div class="player-board p2-board">
                    <div class="board-title p2-title" id="p2-title-label">Pemain 2</div>
                    <div class="options-grid" id="p2-options-container"></div>
                </div>
            </div>
        </div>

        <!-- Panel Kontrol: Reset Kiri, Selesai Kanan -->
        <div class="control-panel">
            <button class="menu-btn btn-gray" onclick="resetGame()">Reset</button>
            <button class="menu-btn btn-orange" onclick="backToMenu()">Selesai</button>
        </div>
    </div>

    <!-- SCREEN: RESULT -->
    <div id="result-screen" class="screen">
        <div class="glass-panel" style="max-width: 600px; text-align: center;">
            <div id="result-message"></div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="menu-btn btn-gray" style="width: auto;" onclick="backToMenu()">Kembali ke Menu</button>
                <button class="menu-btn btn-orange" style="width: auto;" onclick="resetGame()">Main Lagi</button>
            </div>
        </div>
    </div>

            { kanji: '委', reading: 'イ / ゆだねる', meaning: 'Komite', level: 'N3' },
            { kanji: '易', reading: 'エキ / やさしい', meaning: 'Mudah', level: 'N3' },
            { kanji: '移', reading: 'イ / うつる', meaning: 'Pindah', level: 'N3' },
            { kanji: '衣', reading: 'イ / ころも', meaning: 'Pakaian', level: 'N3' },
            { kanji: '胃', reading: 'イ', meaning: 'Lambung / Perut', level: 'N3' },
            { kanji: '違', reading: 'イ / ちがう', meaning: 'Berbeda', level: 'N3' },
            { kanji: '因', reading: 'イン / よる', meaning: 'Penyebab', level: 'N3' },
            { kanji: '営', reading: 'エイ / いとなむ', meaning: 'Mengelola', level: 'N3' },
            { kanji: '栄', reading: 'エイ / さかえる', meaning: 'Makmur', level: 'N3' },
            { kanji: '険', reading: 'ケン / けわしい', meaning: 'Bahaya / Curam', level: 'N3' },
            { kanji: '関', reading: 'カン / かかわる', meaning: 'Hubungan', level: 'N3' },
            { kanji: '局', reading: 'キョク', meaning: 'Kantor / Biro', level: 'N3' },
            { kanji: '信', reading: 'シン', meaning: 'Percaya / Pesan', level: 'N3' },
            { kanji: '達', reading: 'タツ / たち', meaning: 'Mencapai', level: 'N3' },
            { kanji: '残', reading: 'ザン / のこる', meaning: 'Sisa', level: 'N3' },
            { kanji: '念', reading: 'ネン', meaning: 'Perasaan', level: 'N3' },
            { kanji: '笑', reading: 'ショウ / わらう', meaning: 'Tertawa', level: 'N3' },
            { kanji: '法', reading: 'ホウ / ハッ', meaning: 'Hukum', level: 'N3' },
            { kanji: '直', reading: 'チョク / なおす', meaning: 'Langsung', level: 'N3' },
            { kanji: '苦', reading: 'ク / くるしい', meaning: 'Pahit / Susah', level: 'N3' },
            { kanji: '適', reading: 'テキ', meaning: 'Cocok', level: 'N3' },
            { kanji: '確', reading: 'カク / たしか', meaning: 'Pasti', level: 'N3' },
            { kanji: '覚', reading: 'カク / おぼえる', meaning: 'Ingat / Sadar', level: 'N3' },
            { kanji: '側', reading: 'ソク / かわ', meaning: 'Sisi / Sebelah', level: 'N3' },
            { kanji: '解', reading: 'カイ / とく', meaning: 'Solusi', level: 'N3' },
            { kanji: '過', reading: 'カ / すぎる', meaning: 'Melewati', level: 'N3' },
            { kanji: '格', reading: 'カク', meaning: 'Status / Standar', level: 'N3' },
            { kanji: '各', reading: 'カク / おのおの', meaning: 'Setiap', level: 'N3' },
            { kanji: '割', reading: 'カツ / わる', meaning: 'Membagi', level: 'N3' },
            { kanji: '感', reading: 'カン', meaning: 'Perasaan', level: 'N3' },
            { kanji: '管', reading: 'カン / くだ', meaning: 'Kontrol', level: 'N3' },
            { kanji: '完', reading: 'カン', meaning: 'Lengkap', level: 'N3' },
            { kanji: '官', reading: 'カン', meaning: 'Pemerintah', level: 'N3' },
            { kanji: '観', reading: 'カン / みる', meaning: 'Menonton', level: 'N3' },
            { kanji: '記', reading: 'キ / しるす', meaning: 'Mencatat', level: 'N3' },
            { kanji: '期', reading: 'キ / ゴ', meaning: 'Periode', level: 'N3' },
            { kanji: '機', reading: 'キ / はた', meaning: 'Mesin', level: 'N3' },
            { kanji: '議', reading: 'ギ', meaning: 'Rapat', level: 'N3' },
            { kanji: '求', reading: 'キュウ / もとめる', meaning: 'Meminta', level: 'N3' },
            { kanji: '球', reading: 'キュウ / たま', meaning: 'Bola', level: 'N3' },
            { kanji: '給', reading: 'キュウ', meaning: 'Gaji', level: 'N3' },
            { kanji: '決', reading: 'ケツ / きめる', meaning: 'Memutuskan', level: 'N3' },
            { kanji: '結', reading: 'ケツ / むすぶ', meaning: 'Ikat / Hasil', level: 'N3' },
            { kanji: '件', reading: 'ケン', meaning: 'Kasus', level: 'N3' },
            { kanji: '権', reading: 'ケン / ゴン', meaning: 'Hak', level: 'N3' },
            { kanji: '呼', reading: 'コ / よぶ', meaning: 'Memanggil', level: 'N3' }
        ];

        let p1Name = "Pemain 1";
        let p2Name = "Pemain 2";
        let currentData = [];
        let currentQuestion = null;
        let scorePosition = 0; 
        const MAX_STEPS = 6; 
        let isAnswering = false;
        let timerInterval = null;
        let timeLeft = 6;

        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSFX(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch(e) {}
        }

        function startBGM() {
            stopBGM();
            let notes = [220, 246.94, 277.18, 329.63, 369.99, 440];
            let step = 0;
            bgmInterval = setInterval(() => {
                try {
                    initAudio();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                    step++;
                } catch(e) {}
            }, 400);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function initGameSession() {
            playSFX('click');
            p1Name = document.getElementById('player1-name').value.trim() || "Pemain 1";
            p2Name = document.getElementById('player2-name').value.trim() || "Pemain 2";
            const level = document.getElementById('game-level').value;

            document.getElementById('p1-title-label').innerText = p1Name;
            document.getElementById('p2-title-label').innerText = p2Name;

            currentData = kanjiDatabase.filter(k => k.level === level);
            document.getElementById('level-indicator').innerText = `DUEL LEVEL ${level}`;
            scorePosition = 0;
            updateArena();
            switchScreen('game-screen');
            startBGM();
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isAnswering = false;
            clearInterval(timerInterval);
            timeLeft = 6;
            updateTimerDisplay();

            const correctIndex = Math.floor(Math.random() * currentData.length);
            currentQuestion = currentData[correctIndex];

            let wrongOptions = currentData.filter((_, idx) => idx !== correctIndex);
            wrongOptions.sort(() => 0.5 - Math.random()); 
            wrongOptions = wrongOptions.slice(0, 3);

            let allOptions = [currentQuestion, ...wrongOptions];
            allOptions.sort(() => 0.5 - Math.random());

            document.getElementById('kanji-target').innerText = currentQuestion.kanji;
            
            const p1Container = document.getElementById('p1-options-container');
            const p2Container = document.getElementById('p2-options-container');
            
            p1Container.innerHTML = '';
            p2Container.innerHTML = '';
            
            allOptions.forEach(opt => {
                const btn1 = document.createElement('button');
                btn1.className = 'option-btn';
                btn1.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn1.onclick = () => handleAnswer(1, opt.kanji);
                p1Container.appendChild(btn1);

                const btn2 = document.createElement('button');
                btn2.className = 'option-btn';
                btn2.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn2.onclick = () => handleAnswer(2, opt.kanji);
                p2Container.appendChild(btn2);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    loadNextQuestion();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer-display').innerText = `⏱️ 0${timeLeft}s`;
        }

        function handleAnswer(player, selectedKanji) {
            if (isAnswering) return; 
            isAnswering = true;
            clearInterval(timerInterval);

            const isCorrect = (selectedKanji === currentQuestion.kanji);

            if (isCorrect) {
                playSFX('correct');
            } else {
                playSFX('wrong');
            }

            if (player === 1) {
                scorePosition += isCorrect ? -1 : 1; 
            } else if (player === 2) {
                scorePosition += isCorrect ? 1 : -1;
            }

            updateArena();

            if (scorePosition <= -MAX_STEPS) {
                setTimeout(() => endGame(1), 400); 
            } else if (scorePosition >= MAX_STEPS) {
                setTimeout(() => endGame(2), 400);
            } else {
                setTimeout(loadNextQuestion, 250);
            }
        }

        function updateArena() {
            const tugGroup = document.getElementById('tug-group');
            const stepPercentage = 40 / MAX_STEPS; 
            const newLeft = 50 + (scorePosition * stepPercentage); 
            tugGroup.style.left = `${newLeft}%`;
        }

        function endGame(winner) {
            stopBGM();
            switchScreen('result-screen');
            const resultMsg = document.getElementById('result-message');
            if (winner === 1) {
                resultMsg.innerText = `🏁 ${p1Name.toUpperCase()} MENANG! 🏁`;
                resultMsg.style.color = "#3b82f6";
            } else {
                resultMsg.innerText = `🏁 ${p2Name.toUpperCase()} MENANG! 🏁`;
                resultMsg.style.color = "#ef4444";
            }
        }

        function resetGame() {
            playSFX('click');
            if (currentData.length > 0) {
                initGameSession();
            } else {
                backToMenu();
            }
        }

        function backToMenu() {
            playSFX('click');
            stopBGM();
            clearInterval(timerInterval);
            switchScreen('menu-screen');
        }
    </script>
