<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Horse Racing: Kanji Duel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            margin: 0;
            padding: 10px 20px;
            min-height: 100vh;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .screen { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 900px;
            margin: 20px auto;
            text-align: left;
        }

        .menu-hero {
            text-align: center;
            margin-bottom: 30px;
        }
        .menu-hero h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 6px 0;
            letter-spacing: 1px;
        }
        .menu-hero p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0 0 8px 0;
        }
        .creator-tag {
            font-size: 12px;
            color: #38bdf8;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .menu-full {
            grid-column: span 2;
        }

        .form-group {
            margin-bottom: 0;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 8px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .form-input:focus, .form-select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
            background: rgba(0, 0, 0, 0.6);
        }
        .form-select option {
            background: #0f172a;
            color: #ffffff;
        }

        .menu-btn {
            font-family: 'Poppins', sans-serif;
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            font-size: 16px;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #00dbde 0%, #fc00ff 100%);
            box-shadow: 0 10px 25px rgba(0, 219, 222, 0.3);
        }
        .menu-btn:hover { transform: translateY(-3px); filter: brightness(1.15); box-shadow: 0 15px 30px rgba(0, 219, 222, 0.4); }
        .menu-btn:active { transform: translateY(0); }

        .btn-gray { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); width: auto; padding: 12px 30px; margin-top: 0; box-shadow: none; }
        .btn-orange { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3); width: auto; padding: 12px 30px; margin-top: 0; }

        #arena-container {
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }

        .boundary-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 4px;
            z-index: 1;
        }
        .left-line { left: 10%; background: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        .right-line { right: 10%; background: #ef4444; box-shadow: 0 0 15px #ef4444; }
        .center-line { left: 50%; transform: translateX(-50%); width: 2px; background: rgba(255,255,255,0.2); }

        #tug-group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .rope {
            position: absolute;
            left: 70px; right: 70px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            z-index: -1;
        }

        .horse-icon {
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 38px;
            line-height: 1;
            user-select: none;
            box-sizing: border-box;
            padding-bottom: 4px;
        }
        
        .player-horse { 
            border: 3px solid #3b82f6; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            transform: scaleX(1); 
        }
        
        .enemy-horse { 
            border: 3px solid #ef4444; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            transform: scaleX(-1);
        }

        .game-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        #kanji-target {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 80px;
            font-weight: 900;
            color: #ffffff;
            margin: 5px 0 15px 0;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 40%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4));
        }

        .duel-container {
            display: flex;
            justify-content: space-between;
            gap: 25px;
            width: 100%;
        }

        .player-board {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px;
            border-radius: 20px;
        }
        .p1-board { box-shadow: inset 0 4px 20px rgba(59, 130, 246, 0.1); }
        .p2-board { box-shadow: inset 0 4px 20px rgba(239, 68, 68, 0.1); }

        .board-title { font-size: 15px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        .p1-title { color: #3b82f6; text-shadow: 0 0 10px rgba(59,130,246,0.4); }
        .p2-title { color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.4); }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            font-family: 'Noto Sans JP', 'Poppins', sans-serif;
            padding: 16px 10px;
            font-size: 18px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #f8fafc;
        }
        
        .option-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(56, 189, 248, 0.3); }
        .p1-board .option-btn:active { background: rgba(59, 130, 246, 0.35); border-color: #3b82f6; transform: scale(0.96); }
        .p2-board .option-btn:active { background: rgba(239, 68, 68, 0.35); border-color: #ef4444; transform: scale(0.96); }
        
        .meaning-text {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            max-width: 900px;
            margin: 25px auto 0 auto;
        }

        #result-message { 
            font-size: 32px; 
            font-weight: 900; 
            margin-bottom: 25px; 
            text-align: center;
            line-height: 1.3;
        }

        @media (max-width: 768px) {
            .menu-grid { grid-template-columns: 1fr; }
            .menu-full { grid-column: span 1; }
            .duel-container { flex-direction: column; }
            .options-grid { grid-template-columns: 1fr 1fr; }
            #kanji-target { font-size: 60px; }
            .glass-panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- SCREEN: MENU -->
    <div id="menu-screen" class="screen active">
        <div class="glass-panel" style="max-width: 600px;">
            <div class="menu-hero">
                <h1>KANJI DUEL ARENA</h1>
                <p>Uji kecepatan & ketepatan bacaan Kanji bersama kawanmu!</p>
                <div class="creator-tag">Disusun oleh Just Reza</div>
            </div>
            
            <div class="menu-grid">
                <div class="form-group">
                    <label class="form-label">Level Kanji</label>
                    <select id="game-level" class="form-select">
                        <option value="N5">Level N5 (Dasar)</option>
                        <option value="N4">Level N4 (Menengah)</option>
                        <option value="N3">Level N3 (Mahir)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Mode Permainan</label>
                    <select id="game-mode" class="form-select">
                        <option value="kanji-to-hiragana">Kanji ➔ Hiragana & Arti</option>
                        <option value="hiragana-to-kanji">Hiragana & Arti ➔ Kanji</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Nama Rider 1</label>
                    <input type="text" id="player1-name" class="form-input" value="Pemain 1">
                </div>

                <div class="form-group">
                    <label class="form-label">Nama Rider 2</label>
                    <input type="text" id="player2-name" class="form-input" value="Pemain 2">
                </div>
            </div>

            <button class="menu-btn" onclick="initGameSession()">Mulai Balapan!</button>
        </div>
    </div>

    <!-- SCREEN: GAME -->
    <div id="game-screen" class="screen">
        <div class="game-header-info" style="max-width: 900px; margin: 0 auto 10px auto;">
            <div id="level-indicator" style="color: #38bdf8; font-size: 13px; letter-spacing: 2px; font-weight: 800;">DUEL LEVEL --</div>
            <div style="color: #94a3b8; font-size: 13px; font-weight: 600;">⚡ Mode Tanpa Timer</div>
        </div>
        
        <div class="glass-panel" style="padding: 25px;">
            <div id="arena-container">
                <div class="boundary-line left-line"></div>
                <div class="boundary-line center-line"></div>
                <div class="boundary-line right-line"></div>
                
                <div id="tug-group">
                    <div class="horse-icon player-horse">🏇</div>
                    <div class="rope"></div>
                    <div class="horse-icon enemy-horse">🏇</div>
                </div>
            </div>

            <div id="kanji-target">日</div>

            <div class="duel-container">
                <!-- Papan Pemain 1 -->
                <div class="player-board p1-board">
                    <div class="board-title p1-title" id="p1-title-label">Pemain 1</div>
                    <div class="options-grid" id="p1-options-container"></div>
                </div>

                <!-- Papan Pemain 2 -->
                <div class="player-board p2-board">
                    <div class="board-title p2-title" id="p2-title-label">Pemain 2</div>
                    <div class="options-grid" id="p2-options-container"></div>
                </div>
            </div>
        </div>

        <!-- Panel Kontrol: Reset Kiri, Selesai Kanan -->
        <div class="control-panel">
            <button class="menu-btn btn-gray" onclick="resetGame()">Reset</button>
            <button class="menu-btn btn-orange" onclick="backToMenu()">Selesai</button>
        </div>
    </div>

    <!-- SCREEN: RESULT -->
    <div id="result-screen" class="screen">
        <div class="glass-panel" style="max-width: 500px; text-align: center;">
            <div id="result-message"></div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="menu-btn btn-gray" style="width: auto;" onclick="backToMenu()">Menu Utama</button>
                <button class="menu-btn btn-orange" style="width: auto;" onclick="resetGame()">Main Lagi</button>
            </div>
        </div>
    </div>

            { kanji: '愛', reading: 'あいする', meaning: 'Cinta / Kasih', level: 'N3' },
            { kanji: '案', reading: 'あん', meaning: 'Rencana / Ide', level: 'N3' },
            { kanji: '位', reading: 'くらい', meaning: 'Peringkat', level: 'N3' },
            { kanji: '囲', reading: 'かこむ', meaning: 'Mengelilingi', level: 'N3' },
            { kanji: '委', reading: 'ゆだねる', meaning: 'Komite', level: 'N3' },
            { kanji: '易', reading: 'やさしい', meaning: 'Mudah', level: 'N3' },
            { kanji: '移', reading: 'うつる', meaning: 'Pindah', level: 'N3' },
            { kanji: '衣', reading: 'ころも', meaning: 'Pakaian', level: 'N3' },
            { kanji: '胃', reading: 'い', meaning: 'Lambung / Perut', level: 'N3' },
            { kanji: '違', reading: 'ちがう', meaning: 'Berbeda', level: 'N3' },
            { kanji: '因', reading: 'よる', meaning: 'Penyebab', level: 'N3' },
            { kanji: '営', reading: 'いとなむ', meaning: 'Mengelola', level: 'N3' },
            { kanji: '栄', reading: 'さかえる', meaning: 'Makmur', level: 'N3' },
            { kanji: '険', reading: 'けわしい', meaning: 'Bahaya / Curam', level: 'N3' },
            { kanji: '関', reading: 'かかわる', meaning: 'Hubungan', level: 'N3' },
            { kanji: '局', reading: 'きょく', meaning: 'Kantor / Biro', level: 'N3' },
            { kanji: '信', reading: 'しんじる', meaning: 'Percaya / Pesan', level: 'N3' },
            { kanji: '達', reading: 'たち', meaning: 'Mencapai', level: 'N3' },
            { kanji: '残', reading: 'のこる', meaning: 'Sisa', level: 'N3' },
            { kanji: '念', reading: 'ねん', meaning: 'Perasaan', level: 'N3' },
            { kanji: '笑', reading: 'わらう', meaning: 'Tertawa', level: 'N3' },
            { kanji: '法', reading: 'ほう', meaning: 'Hukum', level: 'N3' },
            { kanji: '直', reading: 'なおす', meaning: 'Langsung', level: 'N3' },
            { kanji: '苦', reading: 'くるしい', meaning: 'Pahit / Susah', level: 'N3' },
            { kanji: '適', reading: 'てきする', meaning: 'Cocok', level: 'N3' },
            { kanji: '確', reading: 'たしか', meaning: 'Pasti', level: 'N3' },
            { kanji: '覚', reading: 'おぼえる', meaning: 'Ingat / Sadar', level: 'N3' },
            { kanji: '側', reading: 'かわ', meaning: 'Sisi / Sebelah', level: 'N3' },
            { kanji: '解', reading: 'とく', meaning: 'Solusi', level: 'N3' },
            { kanji: '過', reading: 'すぎる', meaning: 'Melewati', level: 'N3' },
            { kanji: '格', reading: 'かく', meaning: 'Status / Standar', level: 'N3' },
            { kanji: '各', reading: 'おのおの', meaning: 'Setiap', level: 'N3' },
            { kanji: '割', reading: 'わる', meaning: 'Membagi', level: 'N3' },
            { kanji: '感', reading: 'かん', meaning: 'Perasaan', level: 'N3' },
            { kanji: '管', reading: 'くだ', meaning: 'Kontrol', level: 'N3' },
            { kanji: '完', reading: 'かん', meaning: 'Lengkap', level: 'N3' },
            { kanji: '官', reading: 'かん', meaning: 'Pemerintah', level: 'N3' },
            { kanji: '観', reading: 'みる', meaning: 'Menonton', level: 'N3' },
            { kanji: '記', reading: 'しるす', meaning: 'Mencatat', level: 'N3' },
            { kanji: '期', reading: 'き', meaning: 'Periode', level: 'N3' },
            { kanji: '機', reading: 'はた', meaning: 'Mesin', level: 'N3' },
            { kanji: '議', reading: 'ぎ', meaning: 'Rapat', level: 'N3' },
            { kanji: '求', reading: 'もとめる', meaning: 'Meminta', level: 'N3' },
            { kanji: '球', reading: 'たま', meaning: 'Bola', level: 'N3' },
            { kanji: '給', reading: 'きゅう', meaning: 'Gaji', level: 'N3' },
            { kanji: '決', reading: 'きめる', meaning: 'Memutuskan', level: 'N3' },
            { kanji: '結', reading: 'むすぶ', meaning: 'Ikat / Hasil', level: 'N3' },
            { kanji: '件', reading: 'けん', meaning: 'Kasus', level: 'N3' },
            { kanji: '権', reading: 'けん', meaning: 'Hak', level: 'N3' },
            { kanji: '呼', reading: 'よぶ', meaning: 'Memanggil', level: 'N3' }
        ];

        let p1Name = "Pemain 1";
        let p2Name = "Pemain 2";
        let currentData = [];
        let currentQuestion = null;
        let scorePosition = 0; 
        const MAX_STEPS = 6; 
        let isAnswering = false;
        let currentGameMode = "kanji-to-hiragana";
        
        let startTime = null;
        let totalTimeElapsed = 0;

        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSFX(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.12, now); // Disesuaikan agar pas (tidak terlalu kencang)
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.2);
                    gain.gain.setValueAtTime(0.12, now); // Disesuaikan
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.06, now); // Lembut untuk klik
                    gain.gain.linearRampToValueAtTime(0, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch(e) {}
        }

        function startBGM() {
            stopBGM();
            let notes = [220, 246.94, 277.18, 329.63, 369.99, 440];
            let step = 0;
            bgmInterval = setInterval(() => {
                try {
                    initAudio();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.015, audioCtx.currentTime); // Volume BGM dibuat lebih halus/pas sebagai latar belakang
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                    step++;
                } catch(e) {}
            }, 400);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function initGameSession() {
            playSFX('click');
            p1Name = document.getElementById('player1-name').value.trim() || "Pemain 1";
            p2Name = document.getElementById('player2-name').value.trim() || "Pemain 2";
            const level = document.getElementById('game-level').value;
            currentGameMode = document.getElementById('game-mode').value;

            document.getElementById('p1-title-label').innerText = p1Name;
            document.getElementById('p2-title-label').innerText = p2Name;

            currentData = kanjiDatabase.filter(k => k.level === level);
            document.getElementById('level-indicator').innerText = `DUEL LEVEL ${level} (${currentGameMode === 'kanji-to-hiragana' ? 'Kanji ➔ Arti' : 'Arti ➔ Kanji'})`;
            
            scorePosition = 0;
            updateArena();
            
            startTime = Date.now(); // Catat waktu mulai permainan

            switchScreen('game-screen');
            startBGM();
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isAnswering = false;

            const correctIndex = Math.floor(Math.random() * currentData.length);
            currentQuestion = currentData[correctIndex];

            let wrongOptions = currentData.filter((_, idx) => idx !== correctIndex);
            wrongOptions.sort(() => 0.5 - Math.random()); 
            wrongOptions = wrongOptions.slice(0, 3);

            let allOptions = [currentQuestion, ...wrongOptions];
            allOptions.sort(() => 0.5 - Math.random());

            const targetElement = document.getElementById('kanji-target');
            
            if (currentGameMode === 'kanji-to-hiragana') {
                targetElement.innerText = currentQuestion.kanji;
                targetElement.style.fontSize = "80px";
            } else {
                targetElement.innerHTML = `${currentQuestion.reading}<br><span style="font-size:24px; color:#94a3b8; font-family:'Poppins', sans-serif;">(${currentQuestion.meaning})</span>`;
                targetElement.style.fontSize = "45px";
            }
            
            const p1Container = document.getElementById('p1-options-container');
            const p2Container = document.getElementById('p2-options-container');
            
            p1Container.innerHTML = '';
            p2Container.innerHTML = '';
            
            allOptions.forEach(opt => {
                const btn1 = document.createElement('button');
                const btn2 = document.createElement('button');

                if (currentGameMode === 'kanji-to-hiragana') {
                    btn1.className = 'option-btn';
                    btn1.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                    btn1.onclick = () => handleAnswer(1, opt.kanji);

                    btn2.className = 'option-btn';
                    btn2.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                    btn2.onclick = () => handleAnswer(2, opt.kanji);
                } else {
                    btn1.className = 'option-btn';
                    btn1.style.fontFamily = "'Noto Sans JP', sans-serif";
                    btn1.style.fontSize = "28px";
                    btn1.innerText = opt.kanji;
                    btn1.onclick = () => handleAnswer(1, opt.kanji);

                    btn2.className = 'option-btn';
                    btn2.style.fontFamily = "'Noto Sans JP', sans-serif";
                    btn2.style.fontSize = "28px";
                    btn2.innerText = opt.kanji;
                    btn2.onclick = () => handleAnswer(2, opt.kanji);
                }

                p1Container.appendChild(btn1);
                p2Container.appendChild(btn2);
            });
        }

        function handleAnswer(player, selectedKanji) {
            if (isAnswering) return; 
            isAnswering = true;

            const isCorrect = (selectedKanji === currentQuestion.kanji);

            if (isCorrect) {
                playSFX('correct');
            } else {
                playSFX('wrong');
            }

            if (player === 1) {
                scorePosition += isCorrect ? -1 : 1; 
            } else if (player === 2) {
                scorePosition += isCorrect ? 1 : -1;
            }

            updateArena();

            if (scorePosition <= -MAX_STEPS) {
                setTimeout(() => endGame(1), 400); 
            } else if (scorePosition >= MAX_STEPS) {
                setTimeout(() => endGame(2), 400);
            } else {
                setTimeout(loadNextQuestion, 250);
            }
        }

        function updateArena() {
            const tugGroup = document.getElementById('tug-group');
            const stepPercentage = 40 / MAX_STEPS; 
            const newLeft = 50 + (scorePosition * stepPercentage); 
            tugGroup.style.left = `${newLeft}%`;
        }

        function endGame(winner) {
            stopBGM();
            
            // Hitung total durasi waktu permainan dalam detik
            totalTimeElapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(totalTimeElapsed / 60);
            const seconds = totalTimeElapsed % 60;
            const timeFormatted = minutes > 0 ? `${minutes} menit ${seconds} detik` : `${seconds} detik`;

            switchScreen('result-screen');
            const resultMsg = document.getElementById('result-message');
            
            const winnerName = (winner === 1 ? p1Name : p2Name).toUpperCase();
            const winnerColor = winner === 1 ? "#3b82f6" : "#ef4444";

            resultMsg.innerHTML = `
                <div style="color: ${winnerColor}; text-shadow: 0 0 20px ${winnerColor}; margin-bottom: 12px;">🏁 ${winnerName} MENANG! 🏁</div>
                <div style="font-size: 16px; font-weight: 600; color: #94a3b8; letter-spacing: 0.5px;">
                    ⏱️ Total Waktu Permainan: <span style="color: #38bdf8; font-weight: 700;">${timeFormatted}</span>
                </div>
            `;
        }

        function resetGame() {
            playSFX('click');
            if (currentData.length > 0) {
                initGameSession();
            } else {
                backToMenu();
            }
        }

        function backToMenu() {
            playSFX('click');
            stopBGM();
            switchScreen('menu-screen');
        }
    </script>
