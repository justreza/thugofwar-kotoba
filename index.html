<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Horse Racing: Kanji Duel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            margin: 0;
            padding: 10px 20px;
            min-height: 100vh;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .screen { display: none; animation: fadeIn 0.5s ease-in-out; }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            max-width: 1000px;
            margin: 20px auto;
        }

        h1 { 
            font-size: 32px; 
            margin-bottom: 5px; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
        }
        .subtitle { color: #94a3b8; font-weight: 600; letter-spacing: 3px; margin-bottom: 30px; }

        .menu-btn {
            font-family: 'Poppins', sans-serif;
            padding: 15px 35px;
            margin: 10px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-n5 { background: linear-gradient(45deg, #10b981, #059669); box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .btn-n4 { background: linear-gradient(45deg, #3b82f6, #2563eb); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .btn-n3 { background: linear-gradient(45deg, #ef4444, #dc2626); box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .btn-gray { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .btn-orange { background: linear-gradient(45deg, #f59e0b, #d97706); box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
        
        .menu-btn:hover { transform: translateY(-3px) scale(1.05); filter: brightness(1.2); }
        .menu-btn:active { transform: translateY(0) scale(1); }

        #arena-container {
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .boundary-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 4px;
            z-index: 1;
        }
        .left-line { left: 10%; background: #3b82f6; box-shadow: 0 0 15px #3b82f6, 0 0 30px #3b82f6; }
        .right-line { right: 10%; background: #ef4444; box-shadow: 0 0 15px #ef4444, 0 0 30px #ef4444; }
        .center-line { left: 50%; transform: translateX(-50%); width: 2px; background: rgba(255,255,255,0.3); }

        #tug-group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .rope {
            position: absolute;
            left: 60px; right: 60px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            z-index: -1;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* Styling baru khusus untuk Emoji */
        .horse-icon {
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 45px; /* Ukuran emoji diperbesar */
            line-height: 1;
            user-select: none;
            box-sizing: border-box;
        }
        
        .player-horse { 
            border: 2px solid #3b82f6; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), inset 0 0 10px rgba(59, 130, 246, 0.4);
            transform: scaleX(-1); /* Membalikkan emoji agar menghadap kanan */
        }
        
        .enemy-horse { 
            border: 2px solid #ef4444; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6), inset 0 0 10px rgba(239, 68, 68, 0.4);
            /* Menghadap kiri sesuai bawaan emoji */
        }

        #kanji-target {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 85px;
            font-weight: 900;
            color: #ffffff;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.4);
        }

        .duel-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        .player-board {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 20px;
        }
        .p1-board { box-shadow: inset 0 4px 20px rgba(59, 130, 246, 0.1); }
        .p2-board { box-shadow: inset 0 4px 20px rgba(239, 68, 68, 0.1); }

        .board-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; }
        .p1-title { color: #3b82f6; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
        .p2-title { color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.5); }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            font-family: 'Noto Sans JP', 'Poppins', sans-serif;
            padding: 15px 10px;
            font-size: 20px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #f8fafc;
        }
        
        .option-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .p1-board .option-btn:active { background: rgba(59, 130, 246, 0.3); border-color: #3b82f6; transform: scale(0.95); }
        .p2-board .option-btn:active { background: rgba(239, 68, 68, 0.3); border-color: #ef4444; transform: scale(0.95); }
        
        .meaning-text {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            max-width: 1000px;
            margin: 20px auto;
        }

        #result-message { 
            font-size: 40px; 
            font-weight: 800; 
            margin-bottom: 30px; 
            text-shadow: 0 0 20px currentColor; 
        }

        @media (max-width: 768px) {
            .duel-container { flex-direction: column; }
            .options-grid { grid-template-columns: 1fr 1fr; }
            #kanji-target { font-size: 60px; }
            .glass-panel { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- SCREEN: MENU -->
    <div id="menu-screen" class="screen active">
        <div class="glass-panel">
            <h1>Neon Horse Racing</h1>
            <p class="subtitle">KANJI DUEL ARENA</p>
            <p style="font-size: 15px; color: #cbd5e1; margin-bottom: 40px; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.6;">
                Pemain 1 (Kiri) vs Pemain 2 (Kanan). Jawab Kanji dengan tepat lebih cepat dari lawanmu untuk memacu kudamu ke garis finis.
            </p>
            <button class="menu-btn btn-n5" onclick="startGame('N5')">Duel Level N5</button>
            <button class="menu-btn btn-n4" onclick="startGame('N4')">Duel Level N4</button>
            <button class="menu-btn btn-n3" onclick="startGame('N3')">Duel Level N3</button>
        </div>
    </div>

    <!-- SCREEN: GAME -->
    <div id="game-screen" class="screen">
        <h2 id="level-indicator" style="color: #94a3b8; font-size: 16px; letter-spacing: 2px;">LEVEL --</h2>
        
        <div class="glass-panel" style="padding: 20px;">
            <div id="arena-container">
                <div class="boundary-line left-line"></div>
                <div class="boundary-line center-line"></div>
                <div class="boundary-line right-line"></div>
                
                <div id="tug-group">
                    <!-- Kuda menggunakan Emoji -->
                    <div class="horse-icon player-horse">🏇</div>
                    <div class="rope"></div>
                    <div class="horse-icon enemy-horse">🏇</div>
                </div>
            </div>

            <div id="kanji-target">日</div>

            <div class="duel-container">
                <!-- Papan Pemain 1 -->
                <div class="player-board p1-board">
                    <div class="board-title p1-title">Pemain 1 (Kuda Biru)</div>
                    <div class="options-grid" id="p1-options-container"></div>
                </div>

                <!-- Papan Pemain 2 -->
                <div class="player-board p2-board">
                    <div class="board-title p2-title">Pemain 2 (Kuda Merah)</div>
                    <div class="options-grid" id="p2-options-container"></div>
                </div>
            </div>
        </div>

        <!-- Panel Kontrol: Kiri untuk Reset, Kanan untuk Selesai -->
        <div class="control-panel">
            <button class="menu-btn btn-gray" onclick="resetGame()">Reset</button>
            <button class="menu-btn btn-orange" onclick="backToMenu()">Selesai</button>
        </div>
    </div>

    <!-- SCREEN: RESULT -->
    <div id="result-screen" class="screen">
        <div class="glass-panel">
            <div id="result-message"></div>
            <button class="menu-btn btn-gray" onclick="backToMenu()">Kembali ke Menu</button>
            <button class="menu-btn btn-n4" onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        // Database kosakatanya tetap menggunakan istilah yang akurat dan bersih tanpa Romaji
        const kanjiDatabase = [
            { kanji: '一', reading: 'イチ / ひとつ', meaning: 'Satu', level: 'N5' },
            { kanji: '二', reading: 'ニ / ふたつ', meaning: 'Dua', level: 'N5' },
            { kanji: '三', reading: 'サン / みっつ', meaning: 'Tiga', level: 'N5' },
            { kanji: '四', reading: 'シ / よん', meaning: 'Empat', level: 'N5' },
            { kanji: '五', reading: 'ゴ / いつつ', meaning: 'Lima', level: 'N5' },
            { kanji: '肉', reading: 'ニク', meaning: 'Daging olahan', level: 'N5' },
            { kanji: '病', reading: 'ビョウ', meaning: 'Sakit / Rumah Sakit', level: 'N4' },
            { kanji: '銀', reading: 'ギン', meaning: 'Perak / Bank/ATM', level: 'N4' },
            { kanji: '愛', reading: 'アイ / あいする', meaning: 'Cinta / Kasih sayang', level: 'N3' },
            { kanji: '案', reading: 'アン', meaning: 'Rencana / Ide / Draf', level: 'N3' }
            // (Database dipendekkan sebagai contoh, tambahkan sisa list sebelumnya di sini)
        ];

        let currentData = [];
        let currentQuestion = null;
        let scorePosition = 0; 
        const MAX_STEPS = 6; 
        let isAnswering = false;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame(level) {
            currentData = kanjiDatabase.filter(k => k.level === level);
            
            // Jika data kuis level tsb kosong karena disingkat di atas
            if(currentData.length < 4) {
                alert("Tambahkan lagi kosakata ke database agar kuis berjalan lancar!");
                return;
            }

            document.getElementById('level-indicator').innerText = `DUEL LEVEL ${level}`;
            scorePosition = 0;
            updateArena();
            switchScreen('game-screen');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isAnswering = false;
            const correctIndex = Math.floor(Math.random() * currentData.length);
            currentQuestion = currentData[correctIndex];

            let wrongOptions = currentData.filter((_, idx) => idx !== correctIndex);
            wrongOptions.sort(() => 0.5 - Math.random()); 
            wrongOptions = wrongOptions.slice(0, 3);

            let allOptions = [currentQuestion, ...wrongOptions];
            allOptions.sort(() => 0.5 - Math.random());

            document.getElementById('kanji-target').innerText = currentQuestion.kanji;
            
            const p1Container = document.getElementById('p1-options-container');
            const p2Container = document.getElementById('p2-options-container');
            
            p1Container.innerHTML = '';
            p2Container.innerHTML = '';
            
            allOptions.forEach(opt => {
                const btn1 = document.createElement('button');
                btn1.className = 'option-btn';
                btn1.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn1.onclick = () => handleAnswer(1, opt.kanji);
                p1Container.appendChild(btn1);

                const btn2 = document.createElement('button');
                btn2.className = 'option-btn';
                btn2.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn2.onclick = () => handleAnswer(2, opt.kanji);
                p2Container.appendChild(btn2);
            });
        }

        function handleAnswer(player, selectedKanji) {
            if (isAnswering) return; 
            isAnswering = true;

            const isCorrect = (selectedKanji === currentQuestion.kanji);

            if (player === 1) {
                scorePosition += isCorrect ? -1 : 1; 
            } else if (player === 2) {
                scorePosition += isCorrect ? 1 : -1;
            }

            updateArena();

            if (scorePosition <= -MAX_STEPS) {
                setTimeout(() => endGame(1), 400); 
            } else if (scorePosition >= MAX_STEPS) {
                setTimeout(() => endGame(2), 400);
            } else {
                setTimeout(loadNextQuestion, 250);
            }
        }

        function updateArena() {
            const tugGroup = document.getElementById('tug-group');
            const stepPercentage = 40 / MAX_STEPS; 
            const newLeft = 50 + (scorePosition * stepPercentage); 
            tugGroup.style.left = `${newLeft}%`;
        }

        function endGame(winner) {
            switchScreen('result-screen');
            const resultMsg = document.getElementById('result-message');
            if (winner === 1) {
                resultMsg.innerText = "🏁 PEMAIN 1 (BIRU) MENANG! 🏁";
                resultMsg.style.color = "#3b82f6";
            } else {
                resultMsg.innerText = "🏁 PEMAIN 2 (MERAH) MENANG! 🏁";
                resultMsg.style.color = "#ef4444";
            }
        }

        function resetGame() {
            if (currentData.length > 0) {
                startGame(currentData[0].level);
            } else {
                switchScreen('menu-screen');
            }
        }

        function backToMenu() {
            switchScreen('menu-screen');
        }
    </script>
</body>
</html>
