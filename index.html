<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarik Tambang Kuda Kanji</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@500;700&display=swap');

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #334e68;
        }

        .screen { display: none; animation: fadeIn 0.4s ease-in-out; }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2 { color: #102a43; }

        /* Tombol Menu */
        .menu-btn {
            padding: 15px 35px;
            margin: 10px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-n5 { background-color: #10b981; }
        .btn-n4 { background-color: #3b82f6; }
        .btn-n3 { background-color: #ef4444; }
        .btn-gray { background-color: #64748b; }
        .btn-orange { background-color: #f59e0b; }
        
        .menu-btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 15px rgba(0,0,0,0.15); 
        }
        .menu-btn:active { transform: translateY(0); }

        /* Arena Wrapper (Layout Kiri-Tengah-Kanan) */
        #arena-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px auto;
            max-width: 900px;
        }

        .kanji-display {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 70px;
            font-weight: 700;
            color: #102a43;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Arena Tarik Tambang */
        #arena-container {
            flex-grow: 1;
            height: 140px;
            background: white;
            border: 4px solid #cbd5e1;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05), 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Garis Batas */
        .boundary-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 6px;
            z-index: 1;
        }
        .left-line { left: 15%; background: rgba(59, 130, 246, 0.4); border-left: 2px dashed #3b82f6; }
        .right-line { right: 15%; background: rgba(239, 68, 68, 0.4); border-right: 2px dashed #ef4444; }
        .center-line {
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            background: #94a3b8;
        }

        /* Grup Kuda dan Tali */
        #tug-group {
            position: absolute;
            top: 50%;
            left: 50%; /* Nilai awal di tengah */
            transform: translate(-50%, -50%);
            width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }

        .rope {
            position: absolute;
            left: 50px; right: 50px;
            height: 10px;
            background: repeating-linear-gradient(45deg, #8B4513, #8B4513 10px, #A0522D 10px, #A0522D 20px);
            z-index: -1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border-radius: 5px;
        }

        .horse-icon {
            width: 65px; 
            height: 65px;
            background: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            padding: 10px;
        }
        
        .player-horse { border: 4px solid #3b82f6; color: #3b82f6; }
        .enemy-horse { border: 4px solid #ef4444; color: #ef4444; transform: scaleX(-1); }

        /* Opsi Kuis */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 600px;
            margin: 30px auto 0;
        }

        .option-btn {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            padding: 20px;
            font-size: 22px;
            font-weight: 700;
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #102a43;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .option-btn:hover { 
            background: #f8fafc; 
            border-color: #3b82f6; 
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(59, 130, 246, 0.15);
        }
        
        .meaning-text {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: #64748b;
            font-weight: 600;
        }

        /* Panel Kontrol (Reset di Kiri, Selesai di Kanan) */
        .control-panel {
            display: flex;
            justify-content: space-between;
            max-width: 600px;
            margin: 40px auto 20px;
        }

        #result-message { font-size: 35px; font-weight: 800; margin-bottom: 25px; }

        /* Responsif */
        @media (max-width: 768px) {
            #arena-wrapper { flex-direction: column; }
            .kanji-display { font-size: 50px; padding: 10px; width: 80px; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- SCREEN: MENU -->
    <div id="menu-screen" class="screen active">
        <h1>🐎 Tarik Tambang Kuda Kanji 🐎</h1>
        <p style="font-size: 18px; color: #475569; margin-bottom: 30px;">
            Pilih level Kanji Anda. Jawab dengan benar untuk menarik musuh melewati garis kemenangan!
        </p>
        <button class="menu-btn btn-n5" onclick="startGame('N5')">Main Level N5</button>
        <button class="menu-btn btn-n4" onclick="startGame('N4')">Main Level N4</button>
        <button class="menu-btn btn-n3" onclick="startGame('N3')">Main Level N3</button>
    </div>

    <!-- SCREEN: GAME -->
    <div id="game-screen" class="screen">
        <h2 id="level-indicator">Level: --</h2>
        
        <div id="arena-wrapper">
            <div class="kanji-display kanji-target">日</div>
            
            <div id="arena-container">
                <div class="boundary-line left-line"></div>
                <div class="boundary-line center-line"></div>
                <div class="boundary-line right-line"></div>
                
                <div id="tug-group">
                    <!-- Kuda Biru (Kiri/Pemain) -->
                    <div class="horse-icon player-horse">
                        <svg viewBox="0 0 512 512" fill="currentColor">
                            <path d="M224 82.2V32c0-17.7-14.3-32-32-32H128C92.7 0 64 28.7 64 64v22.4L37.1 113.1c-13.7 18.2-18.7 41.3-13.6 63.6l17.8 77.9c4 17.5 16.5 31.7 33.3 37.8l56.8 20.7 7.7 54c3.4 23.7 23.7 41.8 47.7 41.8H256v64c0 17.7 14.3 32 32 32h64c17.7 0 32-14.3 32-32V364.5c0-10.4-4.8-20.1-12.9-26.4l-75.1-58.4 25.1-75.4c4.6-13.8 2.3-29-6-40.8L224 82.2zM128 96a32 32 0 1 1 0-64 32 32 0 1 1 0 64z"/>
                        </svg>
                    </div>
                    
                    <div class="rope"></div>
                    
                    <!-- Kuda Merah (Kanan/Musuh) -->
                    <div class="horse-icon enemy-horse">
                        <svg viewBox="0 0 512 512" fill="currentColor">
                            <path d="M224 82.2V32c0-17.7-14.3-32-32-32H128C92.7 0 64 28.7 64 64v22.4L37.1 113.1c-13.7 18.2-18.7 41.3-13.6 63.6l17.8 77.9c4 17.5 16.5 31.7 33.3 37.8l56.8 20.7 7.7 54c3.4 23.7 23.7 41.8 47.7 41.8H256v64c0 17.7 14.3 32 32 32h64c17.7 0 32-14.3 32-32V364.5c0-10.4-4.8-20.1-12.9-26.4l-75.1-58.4 25.1-75.4c4.6-13.8 2.3-29-6-40.8L224 82.2zM128 96a32 32 0 1 1 0-64 32 32 0 1 1 0 64z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="kanji-display kanji-target">日</div>
        </div>
        
        <div class="options-grid" id="options-container"></div>

        <div class="control-panel">
            <button class="menu-btn btn-gray" onclick="resetGame()">Reset</button>
            <button class="menu-btn btn-orange" onclick="backToMenu()">Selesai</button>
        </div>
    </div>

    <!-- SCREEN: RESULT -->
    <div id="result-screen" class="screen">
        <div id="result-message"></div>
        <button class="menu-btn btn-n5" onclick="backToMenu()">Kembali ke Menu</button>
        <button class="menu-btn btn-n4" onclick="resetGame()">Main Lagi</button>
    </div>

    <script>
        // Data Kanji yang telah difilter (Tanpa Romaji, Menggunakan Kosakata Profesional/Sehari-hari)
        const kanjiDatabase = [
            { kanji: '日', reading: 'ニチ / ひ', meaning: 'Hari / Matahari', level: 'N5' },
            { kanji: '月', reading: 'ゲツ / つき', meaning: 'Bulan', level: 'N5' },
            { kanji: '火', reading: 'カ / ひ', meaning: 'Api', level: 'N5' },
            { kanji: '水', reading: 'スイ / みず', meaning: 'Air', level: 'N5' },
            { kanji: '男', reading: 'ダン / おとこ', meaning: 'Pria', level: 'N5' },
            { kanji: '女', reading: 'ジョ / おんな', meaning: 'Wanita', level: 'N5' },
            { kanji: '食', reading: 'ショク / たべる', meaning: 'Makan', level: 'N5' },
            { kanji: '飲', reading: 'イン / のむ', meaning: 'Minum', level: 'N5' },
            
            { kanji: '悪', reading: 'アク / わるい', meaning: 'Buruk / Jahat', level: 'N4' },
            { kanji: '医', reading: 'イ', meaning: 'Medis / Dokter', level: 'N4' },
            { kanji: '銀', reading: 'ギン', meaning: 'Perak / Bank/ATM', level: 'N4' },
            { kanji: '急', reading: 'キュウ / いそぐ', meaning: 'Cepat / Terburu-buru', level: 'N4' },
            { kanji: '勉', reading: 'ベン', meaning: 'Berusaha / Belajar Giat', level: 'N4' },
            { kanji: '働', reading: 'ドウ / はたらく', meaning: 'Bekerja', level: 'N4' },
            { kanji: '薬', reading: 'ヤク / くすり', meaning: 'Obat', level: 'N4' },
            { kanji: '待', reading: 'タイ / まつ', meaning: 'Tunggu', level: 'N4' },
            
            { kanji: '愛', reading: 'アイ / あいする', meaning: 'Cinta / Kasih sayang', level: 'N3' },
            { kanji: '覚', reading: 'カク / おぼえる', meaning: 'Ingat / Sadar', level: 'N3' },
            { kanji: '落', reading: 'ラク / おちる', meaning: 'Jatuh / Turun / Gagal', level: 'N3' },
            { kanji: '忙', reading: 'ボウ / いそがしい', meaning: 'Sibuk', level: 'N3' },
            { kanji: '打', reading: 'ダ / うつ', meaning: 'Memukul / Mengetik', level: 'N3' },
            { kanji: '済', reading: 'サイ / すむ', meaning: 'Selesai / Melunasi', level: 'N3' },
            { kanji: '守', reading: 'シュ / まもる', meaning: 'Melindungi / Menjaga', level: 'N3' },
            { kanji: '悲', reading: 'ヒ / かなしい', meaning: 'Sedih / Berduka', level: 'N3' }
            // Anda dapat menyalin data array lengkap yang saya berikan di respons sebelumnya ke bagian ini.
        ];

        let currentData = [];
        let currentQuestion = null;
        let scorePosition = 0; // 0 = Tengah. Minus = Kiri menang, Plus = Kanan menang
        const MAX_STEPS = 5; // Butuh 5 langkah benar/salah untuk menyentuh garis

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame(level) {
            currentData = kanjiDatabase.filter(k => k.level === level);
            document.getElementById('level-indicator').innerText = `Level ${level}`;
            
            scorePosition = 0;
            updateArena();

            switchScreen('game-screen');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentData.length === 0) return;

            const correctIndex = Math.floor(Math.random() * currentData.length);
            currentQuestion = currentData[correctIndex];

            let wrongOptions = currentData.filter((_, idx) => idx !== correctIndex);
            wrongOptions.sort(() => 0.5 - Math.random()); 
            wrongOptions = wrongOptions.slice(0, 3);

            let allOptions = [currentQuestion, ...wrongOptions];
            allOptions.sort(() => 0.5 - Math.random());

            // Tampilkan Kanji Ganda (Kiri & Kanan)
            document.querySelectorAll('.kanji-target').forEach(el => {
                el.innerText = currentQuestion.kanji;
            });
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            allOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn.onclick = () => checkAnswer(opt.kanji);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedKanji) {
            // Jika Benar, geser ke kiri (Minus). Jika Salah, geser ke kanan (Plus).
            if (selectedKanji === currentQuestion.kanji) {
                scorePosition -= 1; 
            } else {
                scorePosition += 1;
            }

            updateArena();

            // Cek kondisi kemenangan
            if (scorePosition <= -MAX_STEPS) {
                setTimeout(() => endGame(true), 500); 
            } else if (scorePosition >= MAX_STEPS) {
                setTimeout(() => endGame(false), 500);
            } else {
                loadNextQuestion();
            }
        }

        function updateArena() {
            const tugGroup = document.getElementById('tug-group');
            // Menghitung persentase perpindahan. 
            // 50% adalah tengah. Garis kiri di 15%, Garis kanan di 85%.
            // Jarak ke garis adalah 35%. Tiap langkah adalah 35 / MAX_STEPS = 7%.
            const stepPercentage = 7; 
            const newLeft = 50 + (scorePosition * stepPercentage); 
            tugGroup.style.left = `${newLeft}%`;
        }

        function endGame(isWin) {
            switchScreen('result-screen');
            const resultMsg = document.getElementById('result-message');
            if (isWin) {
                resultMsg.innerText = "🏆 Kamu Menang! Kuda lawan berhasil ditarik melewati garis! 🏆";
                resultMsg.style.color = "#10b981";
            } else {
                resultMsg.innerText = "💥 Game Over! Kamu ditarik musuh melewati garis! 💥";
                resultMsg.style.color = "#ef4444";
            }
        }

        function resetGame() {
            if (currentData.length > 0) {
                startGame(currentData[0].level);
            } else {
                switchScreen('menu-screen');
            }
        }

        function backToMenu() {
            switchScreen('menu-screen');
        }
    </script>
</body>
</html>
