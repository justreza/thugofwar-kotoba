<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarik Tambang Kuda Kanji</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@500;700&display=swap');

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            margin: 0;
            padding: 10px 20px;
            min-height: 100vh;
            color: #334e68;
            overflow-x: hidden;
        }

        .screen { display: none; animation: fadeIn 0.4s ease-in-out; }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2 { color: #102a43; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #64748b; font-weight: 600; margin-bottom: 30px; letter-spacing: 1px; }

        /* Tombol Menu Umum */
        .menu-btn {
            padding: 15px 35px;
            margin: 10px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-n5 { background-color: #10b981; }
        .btn-n4 { background-color: #3b82f6; }
        .btn-n3 { background-color: #ef4444; }
        .btn-gray { background-color: #64748b; }
        .btn-orange { background-color: #f59e0b; }
        
        .menu-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.15); }
        .menu-btn:active { transform: translateY(0); }

        /* Arena Tarik Tambang */
        #arena-wrapper {
            margin: 15px auto;
            max-width: 1000px;
        }

        #arena-container {
            width: 100%;
            height: 130px;
            background: white;
            border: 4px solid #cbd5e1;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05), 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Garis Batas */
        .boundary-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 6px;
            z-index: 1;
        }
        .left-line { left: 10%; background: rgba(59, 130, 246, 0.4); border-left: 2px dashed #3b82f6; }
        .right-line { right: 10%; background: rgba(239, 68, 68, 0.4); border-right: 2px dashed #ef4444; }
        .center-line { left: 50%; transform: translateX(-50%); width: 4px; background: #94a3b8; }

        /* Grup Kuda dan Tali */
        #tug-group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }

        .rope {
            position: absolute;
            left: 50px; right: 50px;
            height: 10px;
            background: repeating-linear-gradient(45deg, #8B4513, #8B4513 10px, #A0522D 10px, #A0522D 20px);
            z-index: -1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border-radius: 5px;
        }

        .horse-icon {
            width: 65px; height: 65px;
            background: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            padding: 10px;
        }
        .player-horse { border: 4px solid #3b82f6; color: #3b82f6; }
        .enemy-horse { border: 4px solid #ef4444; color: #ef4444; transform: scaleX(-1); }

        /* Target Kanji Utama */
        #kanji-target {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 80px;
            font-weight: 700;
            color: #102a43;
            margin: 10px 0;
            text-shadow: 2px 2px 0px white, -2px -2px 0px white;
        }

        /* Mode 2 Pemain (Kiri vs Kanan) */
        .duel-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .player-board {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }
        .p1-board { border-top: 6px solid #3b82f6; }
        .p2-board { border-top: 6px solid #ef4444; }

        .board-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; }
        .p1-title { color: #3b82f6; }
        .p2-title { color: #ef4444; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            padding: 15px 10px;
            font-size: 18px;
            font-weight: 700;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #102a43;
        }
        
        .p1-board .option-btn:active { background: #eff6ff; border-color: #3b82f6; transform: scale(0.96); }
        .p2-board .option-btn:active { background: #fef2f2; border-color: #ef4444; transform: scale(0.96); }
        
        .meaning-text {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
        }

        /* Panel Kontrol (Kiri: Reset, Kanan: Selesai) */
        .control-panel {
            display: flex;
            justify-content: space-between;
            max-width: 1000px;
            margin: 25px auto 20px;
        }

        #result-message { font-size: 35px; font-weight: 800; margin-bottom: 25px; }

        @media (max-width: 768px) {
            .duel-container { flex-direction: column; }
            .options-grid { grid-template-columns: 1fr 1fr; }
            #kanji-target { font-size: 60px; }
        }
    </style>
</head>
<body>

        <p class="subtitle">VERSI DUEL MULTIPLAYER OLEH JUST REZA</p>

            </div>

                <div class="options-grid" id="p2-options-container"></div>
            </div>
        </div>

            <button class="menu-btn btn-orange" onclick="backToMenu()">Selesai</button>
        </div>
    </div>

            { kanji: '残', reading: 'ザン / のこる', meaning: 'Sisa / Meninggalkan', level: 'N3' },
            { kanji: '念', reading: 'ネン', meaning: 'Pikiran / Perasaan', level: 'N3' },
            { kanji: '笑', reading: 'ショウ / わらう', meaning: 'Tersenyum / Tertawa', level: 'N3' },
            { kanji: '法', reading: 'ホウ / ハッ', meaning: 'Hukum / Metode', level: 'N3' },
            { kanji: '直', reading: 'チョク / なおす', meaning: 'Langsung / Memperbaiki', level: 'N3' },
            { kanji: '苦', reading: 'ク / くるしい', meaning: 'Pahit / Susah', level: 'N3' },
            { kanji: '適', reading: 'テキ', meaning: 'Cocok / Sesuai', level: 'N3' },
            { kanji: '確', reading: 'カク / たしか', meaning: 'Pasti / Nyata', level: 'N3' },
            { kanji: '覚', reading: 'カク / おぼえる', meaning: 'Ingat / Sadar', level: 'N3' },
            { kanji: '側', reading: 'ソク / かわ', meaning: 'Sisi / Sebelah', level: 'N3' },
            { kanji: '解', reading: 'カイ / とく', meaning: 'Mengerti / Solusi', level: 'N3' },
            { kanji: '過', reading: 'カ / すぎる', meaning: 'Melewati / Berlebihan', level: 'N3' },
            { kanji: '格', reading: 'カク', meaning: 'Status / Standar', level: 'N3' },
            { kanji: '各', reading: 'カク / おのおの', meaning: 'Masing-masing / Setiap', level: 'N3' },
            { kanji: '割', reading: 'カツ / わる', meaning: 'Membagi / Rasio', level: 'N3' },
            { kanji: '感', reading: 'カン', meaning: 'Perasaan / Kesan', level: 'N3' },
            { kanji: '管', reading: 'カン / くだ', meaning: 'Manajemen / Kontrol', level: 'N3' },
            { kanji: '完', reading: 'カン', meaning: 'Lengkap / Selesai', level: 'N3' },
            { kanji: '官', reading: 'カン', meaning: 'Pemerintah / Birokrat', level: 'N3' },
            { kanji: '観', reading: 'カン / みる', meaning: 'Menonton / Pandangan', level: 'N3' },
            { kanji: '記', reading: 'キ / しるす', meaning: 'Mencatat / Menulis', level: 'N3' },
            { kanji: '期', reading: 'キ / ゴ', meaning: 'Periode / Jangka Waktu', level: 'N3' },
            { kanji: '機', reading: 'キ / はた', meaning: 'Mesin / Peluang', level: 'N3' },
            { kanji: '議', reading: 'ギ', meaning: 'Rapat / Diskusi', level: 'N3' },
            { kanji: '求', reading: 'キュウ / もとめる', meaning: 'Meminta / Menuntut', level: 'N3' },
            { kanji: '球', reading: 'キュウ / たま', meaning: 'Bola / Benda Bulat', level: 'N3' },
            { kanji: '給', reading: 'キュウ', meaning: 'Gaji / Upah / Pasokan', level: 'N3' },
            { kanji: '決', reading: 'ケツ / きめる', meaning: 'Memutuskan / Menetapkan', level: 'N3' },
            { kanji: '結', reading: 'ケツ / むすぶ', meaning: 'Ikat / Hubung / Hasil', level: 'N3' },
            { kanji: '件', reading: 'ケン', meaning: 'Kasus / Masalah', level: 'N3' },
            { kanji: '権', reading: 'ケン / ゴン', meaning: 'Hak / Kekuasaan', level: 'N3' },
            { kanji: '呼', reading: 'コ / よぶ', meaning: 'Memanggil / Bernapas', level: 'N3' }
        ];

        let currentData = [];
        let currentQuestion = null;
        let scorePosition = 0; 
        const MAX_STEPS = 6; // Jarak langkah kemenangan
        let isAnswering = false;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame(level) {
            currentData = kanjiDatabase.filter(k => k.level === level);
            document.getElementById('level-indicator').innerText = `Duel Level ${level}`;
            scorePosition = 0;
            updateArena();
            switchScreen('game-screen');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isAnswering = false;
            const correctIndex = Math.floor(Math.random() * currentData.length);
            currentQuestion = currentData[correctIndex];

            let wrongOptions = currentData.filter((_, idx) => idx !== correctIndex);
            wrongOptions.sort(() => 0.5 - Math.random()); 
            wrongOptions = wrongOptions.slice(0, 3);

            let allOptions = [currentQuestion, ...wrongOptions];
            // Acak urutan agar adil
            allOptions.sort(() => 0.5 - Math.random());

            document.getElementById('kanji-target').innerText = currentQuestion.kanji;
            
            const p1Container = document.getElementById('p1-options-container');
            const p2Container = document.getElementById('p2-options-container');
            
            p1Container.innerHTML = '';
            p2Container.innerHTML = '';
            
            // Susunan ganda persis sama untuk P1 dan P2
            allOptions.forEach(opt => {
                // Tombol P1
                const btn1 = document.createElement('button');
                btn1.className = 'option-btn';
                btn1.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn1.onclick = () => handleAnswer(1, opt.kanji);
                p1Container.appendChild(btn1);

                // Tombol P2
                const btn2 = document.createElement('button');
                btn2.className = 'option-btn';
                btn2.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn2.onclick = () => handleAnswer(2, opt.kanji);
                p2Container.appendChild(btn2);
            });
        }

        function handleAnswer(player, selectedKanji) {
            if (isAnswering) return; // Kunci input jika sedang proses geser
            isAnswering = true;

            const isCorrect = (selectedKanji === currentQuestion.kanji);

            // Logika Tarik Tambang: Minus (Kiri/P1 Menang), Plus (Kanan/P2 Menang)
            if (player === 1) {
                scorePosition += isCorrect ? -1 : 1; 
            } else if (player === 2) {
                scorePosition += isCorrect ? 1 : -1;
            }

            updateArena();

            if (scorePosition <= -MAX_STEPS) {
                setTimeout(() => endGame(1), 300); 
            } else if (scorePosition >= MAX_STEPS) {
                setTimeout(() => endGame(2), 300);
            } else {
                setTimeout(loadNextQuestion, 200);
            }
        }

        function updateArena() {
            const tugGroup = document.getElementById('tug-group');
            // 50% di tengah. Batas kiri di 10%, batas kanan di 90% (40% jarak ke tiap sisi).
            // Setiap langkah menggeser posisi.
            const stepPercentage = 40 / MAX_STEPS; 
            const newLeft = 50 + (scorePosition * stepPercentage); 
            tugGroup.style.left = `${newLeft}%`;
        }

        function endGame(winner) {
            switchScreen('result-screen');
            const resultMsg = document.getElementById('result-message');
            if (winner === 1) {
                resultMsg.innerText = "🏆 PEMAIN 1 (BIRU) MENANG! 🏆";
                resultMsg.style.color = "#3b82f6";
            } else {
                resultMsg.innerText = "🏆 PEMAIN 2 (MERAH) MENANG! 🏆";
                resultMsg.style.color = "#ef4444";
            }
        }

        function resetGame() {
            if (currentData.length > 0) {
                startGame(currentData[0].level);
            } else {
                switchScreen('menu-screen');
            }
        }

        function backToMenu() {
            switchScreen('menu-screen');
        }
    </script>
</body>
