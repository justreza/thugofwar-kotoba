<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horse Racing Kanji</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Noto+Sans+JP:wght@500;700;900&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: radial-gradient(circle at center, #450a0a 0%, #180909 100%);
            margin: 0;
            padding: 10px 20px;
            min-height: 100vh;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .screen { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glass-panel {
            background: rgba(24, 9, 9, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 900px;
            margin: 20px auto;
            text-align: left;
        }

        .menu-hero {
            text-align: center;
            margin-bottom: 25px;
        }
        .menu-hero h1 {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(135deg, #f87171 0%, #fb923c 50%, #facc15 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }
        .menu-hero p {
            color: #cbd5e1;
            font-size: 14px;
            margin: 0;
        }

        /* Menu layout dibuat ke bawah (1 kolom) */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 0;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #f87171;
            margin-bottom: 6px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        .form-input:focus, .form-select:focus {
            border-color: #f87171;
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.25);
            background: rgba(0, 0, 0, 0.6);
        }
        .form-select option {
            background: #180909;
            color: #ffffff;
        }

        .menu-btn {
            font-family: 'Poppins', sans-serif;
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
        }
        .menu-btn:hover { transform: translateY(-3px); filter: brightness(1.15); box-shadow: 0 15px 30px rgba(239, 68, 68, 0.4); }
        .menu-btn:active { transform: translateY(0); }

        .btn-gray { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); width: auto; padding: 12px 30px; margin-top: 0; box-shadow: none; }
        .btn-orange { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3); width: auto; padding: 12px 30px; margin-top: 0; }

        #arena-container {
            width: 100%;
            height: 130px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
            margin-bottom: 25px;
        }

        .boundary-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 4px;
            z-index: 1;
        }
        .left-line { left: 10%; background: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        .right-line { right: 10%; background: #ef4444; box-shadow: 0 0 15px #ef4444; }
        .center-line { left: 50%; transform: translateX(-50%); width: 2px; background: rgba(255,255,255,0.2); }

        #tug-group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .rope {
            position: absolute;
            left: 70px; right: 70px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            z-index: -1;
        }

        .horse-icon {
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 38px;
            line-height: 1;
            user-select: none;
            box-sizing: border-box;
            padding-bottom: 4px;
        }
        
        .player-horse { border: 3px solid #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); }
        .enemy-horse { border: 3px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); transform: scaleX(-1); }

        .game-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        #kanji-target-wrapper {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.4);
        }

        #kanji-target {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 96px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
            margin: 0;
            background: linear-gradient(180deg, #ffffff 40%, #f87171 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(248, 113, 113, 0.4));
        }

        .duel-container {
            display: flex;
            justify-content: space-between;
            gap: 25px;
            width: 100%;
        }

        .player-board {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px;
            border-radius: 20px;
        }
        .p1-board { box-shadow: inset 0 4px 20px rgba(59, 130, 246, 0.1); }
        .p2-board { box-shadow: inset 0 4px 20px rgba(239, 68, 68, 0.1); }

        .board-title { font-size: 15px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        .p1-title { color: #3b82f6; text-shadow: 0 0 10px rgba(59,130,246,0.4); }
        .p2-title { color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.4); }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            font-family: 'Noto Sans JP', 'Poppins', sans-serif;
            padding: 14px 8px;
            font-size: 16px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #f8fafc;
        }
        
        .option-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(248, 113, 113, 0.4); }
        .p1-board .option-btn:active { background: rgba(59, 130, 246, 0.35); border-color: #3b82f6; transform: scale(0.96); }
        .p2-board .option-btn:active { background: rgba(239, 68, 68, 0.35); border-color: #ef4444; transform: scale(0.96); }
        
        .reading-tag {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            color: #fca5a5;
            font-weight: 600;
        }
        .meaning-text {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            max-width: 900px;
            margin: 25px auto 0 auto;
        }

        #result-message { 
            font-size: 32px; 
            font-weight: 900; 
            margin-bottom: 25px; 
            text-align: center;
            line-height: 1.3;
        }

        @media (max-width: 768px) {
            .duel-container { flex-direction: column; }
            .options-grid { grid-template-columns: 1fr 1fr; }
            #kanji-target { font-size: 72px; }
            .glass-panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- SCREEN: MENU -->
    <div id="menu-screen" class="screen active">
        <div class="glass-panel" style="max-width: 500px;">
            <div class="menu-hero">
                <h1>KANJI DUEL ARENA</h1>
                <p>Uji kecepatan & ketepatan Kanji yang disusun oleh Just Reza</p>
            </div>
            
            <div class="menu-grid">
                <div class="form-group">
                    <label class="form-label">Level Kanji</label>
                    <select id="game-level" class="form-select">
                        <option value="N5">Level N5</option>
                        <option value="N4">Level N4</option>
                        <option value="N3">Level N3</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Mode Permainan</label>
                    <select id="game-mode" class="form-select">
                        <option value="kanji-to-hiragana">Kanji ➔ Bacaan & Arti</option>
                        <option value="hiragana-to-kanji">Bacaan & Arti ➔ Kanji</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Nama Rider 1</label>
                    <input type="text" id="player1-name" class="form-input" value="Pemain 1">
                </div>

                <div class="form-group">
                    <label class="form-label">Nama Rider 2</label>
                    <input type="text" id="player2-name" class="form-input" value="Pemain 2">
                </div>
            </div>

            <button class="menu-btn" onclick="initGameSession()">Mulai Balapan!</button>
        </div>
    </div>

    <!-- SCREEN: GAME -->
    <div id="game-screen" class="screen">
        <div class="game-header-info" style="max-width: 900px; margin: 0 auto 10px auto;">
            <div id="level-indicator" style="color: #f87171; font-size: 13px; letter-spacing: 2px; font-weight: 800;">DUEL LEVEL --</div>
            <div style="color: #cbd5e1; font-size: 13px; font-weight: 600;">⚡Jadilah pemenang!⚡</div>
        </div>
        
        <div class="glass-panel" style="padding: 25px;">
            <div id="arena-container">
                <div class="boundary-line left-line"></div>
                <div class="boundary-line center-line"></div>
                <div class="boundary-line right-line"></div>
                
                <div id="tug-group">
                    <div class="horse-icon player-horse">🏇</div>
                    <div class="rope"></div>
                    <div class="horse-icon enemy-horse">🏇</div>
                </div>
            </div>

            <div id="kanji-target-wrapper">
                <div id="kanji-target">日</div>
            </div>

            <div class="duel-container">
                <div class="player-board p1-board">
                    <div class="board-title p1-title" id="p1-title-label">Pemain 1</div>
                    <div class="options-grid" id="p1-options-container"></div>
                </div>

                <div class="player-board p2-board">
                    <div class="board-title p2-title" id="p2-title-label">Pemain 2</div>
                    <div class="options-grid" id="p2-options-container"></div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <button class="menu-btn btn-gray" onclick="resetGame()">Reset</button>
            <button class="menu-btn btn-orange" onclick="backToMenu()">Selesai</button>
        </div>
    </div>

    <!-- SCREEN: RESULT -->
    <div id="result-screen" class="screen">
        <div class="glass-panel" style="max-width: 500px; text-align: center;">
            <div id="result-message"></div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="menu-btn btn-gray" style="width: auto;" onclick="backToMenu()">Menu Utama</button>
                <button class="menu-btn btn-orange" style="width: auto;" onclick="resetGame()">Main Lagi</button>
            </div>
        </div>
    </div>

            { kanji: '計', kun: 'はかる', on: 'けい', meaning: 'Rencana / Total', level: 'N4' },
            { kanji: '兄', kun: 'あに', on: 'けい / きょう', meaning: 'Kakak Laki-laki', level: 'N4' },
            { kanji: '姉', kun: 'あね', on: 'し', meaning: 'Kakak Perempuan', level: 'N4' },
            { kanji: '弟', kun: 'おとうと', on: 'てい / だい', meaning: 'Adik Laki-laki', level: 'N4' },
            { kanji: '妹', kun: 'いもうと', on: 'まい', meaning: 'Adik Perempuan', level: 'N4' },
            { kanji: '軽', kun: 'かるい', on: 'けい', meaning: 'Ringan', level: 'N4' },
            { kanji: '研', kun: 'とぐ', on: 'けん', meaning: 'Mengasah / Riset', level: 'N4' },
            { kanji: '県', kun: '-', on: 'けん', meaning: 'Prefektur', level: 'N4' },
            { kanji: '建', kun: 'たてる', on: 'けん / こん', meaning: 'Membangun', level: 'N4' },
            { kanji: '験', kun: '-', on: 'けん', meaning: 'Ujian / Tes', level: 'N4' },
            { kanji: '元', kun: 'もと', on: 'げん / がん', meaning: 'Asal / Sehat', level: 'N4' },
            { kanji: '工', kun: '-', on: 'こう / く', meaning: 'Teknik', level: 'N4' },
            { kanji: '広', kun: 'ひろい', on: 'こう', meaning: 'Luas / Lebar', level: 'N4' },
            { kanji: '考', kun: 'かんがえる', on: 'こう', meaning: 'Berpikir', level: 'N4' },
            { kanji: '光', kun: 'ひかり', on: 'こう', meaning: 'Cahaya', level: 'N4' },
            { kanji: '病', kun: 'やまい / やむ', on: 'びょう / へい', meaning: 'Sakit / Rumah Sakit', level: 'N4' },

            // ================= LEVEL N3 =================
            { kanji: '愛', kun: 'いとしい', on: 'あい', meaning: 'Cinta / Kasih', level: 'N3' },
            { kanji: '案', kun: '-', on: 'あん', meaning: 'Rencana / Ide', level: 'N3' },
            { kanji: '位', kun: 'くらい', on: 'い', meaning: 'Peringkat', level: 'N3' },
            { kanji: '囲', kun: 'かこむ', on: 'い', meaning: 'Mengelilingi', level: 'N3' },
            { kanji: '委', kun: 'ゆだねる', on: 'い', meaning: 'Komite', level: 'N3' },
            { kanji: '易', kun: 'やすい', on: 'い / えき', meaning: 'Mudah', level: 'N3' },
            { kanji: '移', kun: 'うつる', on: 'い', meaning: 'Pindah', level: 'N3' },
            { kanji: '衣', kun: 'ころも', on: 'い', meaning: 'Pakaian', level: 'N3' },
            { kanji: '胃', kun: '-', on: 'い', meaning: 'Lambung / Perut', level: 'N3' },
            { kanji: '違', kun: 'ちがう', on: 'い', meaning: 'Berbeda', level: 'N3' },
            { kanji: '因', kun: 'よる', on: 'いん', meaning: 'Penyebab', level: 'N3' },
            { kanji: '営', kun: 'いとなむ', on: 'えい', meaning: 'Mengelola', level: 'N3' },
            { kanji: '栄', kun: 'さかえる', on: 'えい', meaning: 'Makmur', level: 'N3' },
            { kanji: '険', kun: 'けわしい', on: 'けん', meaning: 'Bahaya / Curam', level: 'N3' },
            { kanji: '関', kun: 'せき / かかわる', on: 'かん', meaning: 'Hubungan', level: 'N3' },
            { kanji: '局', kun: 'つボ', on: 'きょく', meaning: 'Kantor / Biro', level: 'N3' },
            { kanji: '信', kun: '-', on: 'しん', meaning: 'Percaya / Pesan', level: 'N3' },
            { kanji: '達', kun: 'たち', on: 'たつ', meaning: 'Mencapai', level: 'N3' },
            { kanji: '残', kun: 'のこる', on: 'ざん', meaning: 'Sisa', level: 'N3' },
            { kanji: '念', kun: '-', on: 'ねん', meaning: 'Perasaan', level: 'N3' },
            { kanji: '笑', kun: 'わらう', on: 'しょう', meaning: 'Tertawa', level: 'N3' },
            { kanji: '法', kun: '-', on: 'ほう', meaning: 'Hukum', level: 'N3' },
            { kanji: '直', kun: 'なおす', on: 'ちょく / じき', meaning: 'Langsung', level: 'N3' },
            { kanji: '苦', kun: 'くるしい', on: 'く', meaning: 'Pahit / Susah', level: 'N3' },
            { kanji: '適', kun: 'かなう', on: 'てき', meaning: 'Cocok', level: 'N3' },
            { kanji: '確', kun: 'たしか', on: 'かく', meaning: 'Pasti', level: 'N3' },
            { kanji: '覚', kun: 'おぼえる', on: 'かく', meaning: 'Ingat / Sadar', level: 'N3' },
            { kanji: '側', kun: 'かわ', on: 'そく', meaning: 'Sisi / Sebelah', level: 'N3' },
            { kanji: '解', kun: 'とく', on: 'かい / げ', meaning: 'Solusi', level: 'N3' },
            { kanji: '過', kun: 'すぎる', on: 'か', meaning: 'Melewati', level: 'N3' },
            { kanji: '格', kun: '-', on: 'かく', meaning: 'Status / Standar', level: 'N3' },
            { kanji: '各', kun: 'おのおの', on: 'かく', meaning: 'Setiap', level: 'N3' },
            { kanji: '割', kun: 'わる', on: 'かつ', meaning: 'Membagi', level: 'N3' },
            { kanji: '感', kun: '-', on: 'かん', meaning: 'Perasaan', level: 'N3' },
            { kanji: '管', kun: 'くだ', on: 'かん', meaning: 'Kontrol', level: 'N3' },
            { kanji: '完', kun: '-', on: 'かん', meaning: 'Lengkap', level: 'N3' },
            { kanji: '官', kun: '-', on: 'かん', meaning: 'Pemerintah', level: 'N3' },
            { kanji: '観', kun: 'みる', on: 'かん', meaning: 'Menonton', level: 'N3' },
            { kanji: '記', kun: 'しるす', on: 'き', meaning: 'Mencatat', level: 'N3' },
            { kanji: '期', kun: '-', on: 'き', meaning: 'Periode', level: 'N3' },
            { kanji: '機', kun: 'はた', on: 'き', meaning: 'Mesin', level: 'N3' },
            { kanji: '議', kun: '-', on: 'ぎ', meaning: 'Rapat', level: 'N3' },
            { kanji: '求', kun: 'もとめる', on: 'きゅう', meaning: 'Meminta', level: 'N3' },
            { kanji: '球', kun: 'たま', on: 'きゅう', meaning: 'Bola', level: 'N3' },
            { kanji: '給', kun: 'たまう', on: 'きゅう', meaning: 'Gaji', level: 'N3' },
            { kanji: '決', kun: 'きめる', on: 'けつ', meaning: 'Memutuskan', level: 'N3' },
            { kanji: '結', kun: 'むすぶ', on: 'けつ', meaning: 'Ikat / Hasil', level: 'N3' },
            { kanji: '件', kun: '-', on: 'けん', meaning: 'Kasus', level: 'N3' },
            { kanji: '権', kun: '-', on: 'けん / ごん', meaning: 'Hak', level: 'N3' },
            { kanji: '呼', kun: 'よぶ', on: 'こ', meaning: 'Memanggil', level: 'N3' }
        ];

        let p1Name = "Pemain 1";
        let p2Name = "Pemain 2";
        let currentData = [];
        let currentQuestion = null;
        let scorePosition = 0; 
        const MAX_STEPS = 6; 
        let isAnswering = false;
        let currentGameMode = "kanji-to-hiragana";
        
        let startTime = null;
        let totalTimeElapsed = 0;

        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSFX(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.2);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch(e) {}
        }

        function startBGM() {
            stopBGM();
            let notes = [220, 246.94, 277.18, 329.63, 369.99, 440];
            let step = 0;
            bgmInterval = setInterval(() => {
                try {
                    initAudio();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                    step++;
                } catch(e) {}
            }, 400);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function initGameSession() {
            playSFX('click');
            p1Name = document.getElementById('player1-name').value.trim() || "Pemain 1";
            p2Name = document.getElementById('player2-name').value.trim() || "Pemain 2";
            const level = document.getElementById('game-level').value;
            currentGameMode = document.getElementById('game-mode').value;

            document.getElementById('p1-title-label').innerText = p1Name;
            document.getElementById('p2-title-label').innerText = p2Name;

            currentData = kanjiDatabase.filter(k => k.level === level);
            document.getElementById('level-indicator').innerText = `DUEL LEVEL ${level} (${currentGameMode === 'kanji-to-hiragana' ? 'Kanji ➔ Bacaan & Arti' : 'Bacaan & Arti ➔ Kanji'})`;
            
            scorePosition = 0;
            updateArena();
            
            startTime = Date.now();

            switchScreen('game-screen');
            startBGM();
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isAnswering = false;

            const correctIndex = Math.floor(Math.random() * currentData.length);
            currentQuestion = currentData[correctIndex];

            let wrongOptions = currentData.filter((_, idx) => idx !== correctIndex);
            wrongOptions.sort(() => 0.5 - Math.random()); 
            wrongOptions = wrongOptions.slice(0, 3);

            let allOptions = [currentQuestion, ...wrongOptions];
            allOptions.sort(() => 0.5 - Math.random());

            const targetElement = document.getElementById('kanji-target');
            
            if (currentGameMode === 'kanji-to-hiragana') {
                targetElement.innerText = currentQuestion.kanji;
                targetElement.style.fontSize = "96px";
            } else {
                targetElement.innerHTML = `<span style="font-size:32px; color:#f87171;">Kun: ${currentQuestion.kun}</span><br><span style="font-size:26px; color:#cbd5e1;">On: ${currentQuestion.on}</span><br><span style="font-size:18px; color:#94a3b8; font-family:'Poppins', sans-serif;">(${currentQuestion.meaning})</span>`;
                targetElement.style.fontSize = "40px";
            }
            
            const p1Container = document.getElementById('p1-options-container');
            const p2Container = document.getElementById('p2-options-container');
            
            p1Container.innerHTML = '';
            p2Container.innerHTML = '';
            
            allOptions.forEach(opt => {
                const btn1 = document.createElement('button');
                const btn2 = document.createElement('button');

                if (currentGameMode === 'kanji-to-hiragana') {
                    btn1.className = 'option-btn';
                    btn1.innerHTML = `<span class="reading-tag">Kun: ${opt.kun}</span><span class="reading-tag">On: ${opt.on}</span><span class="meaning-text">(${opt.meaning})</span>`;
                    btn1.onclick = () => handleAnswer(1, opt.kanji);

                    btn2.className = 'option-btn';
                    btn2.innerHTML = `<span class="reading-tag">Kun: ${opt.kun}</span><span class="reading-tag">On: ${opt.on}</span><span class="meaning-text">(${opt.meaning})</span>`;
                    btn2.onclick = () => handleAnswer(2, opt.kanji);
                } else {
                    btn1.className = 'option-btn';
                    btn1.style.fontFamily = "'Noto Sans JP', sans-serif";
                    btn1.style.fontSize = "32px";
                    btn1.innerText = opt.kanji;
                    btn1.onclick = () => handleAnswer(1, opt.kanji);

                    btn2.className = 'option-btn';
                    btn2.style.fontFamily = "'Noto Sans JP', sans-serif";
                    btn2.style.fontSize = "32px";
                    btn2.innerText = opt.kanji;
                    btn2.onclick = () => handleAnswer(2, opt.kanji);
                }

                p1Container.appendChild(btn1);
                p2Container.appendChild(btn2);
            });
        }

        function handleAnswer(player, selectedKanji) {
            if (isAnswering) return; 
            isAnswering = true;

            const isCorrect = (selectedKanji === currentQuestion.kanji);

            if (isCorrect) {
                playSFX('correct');
            } else {
                playSFX('wrong');
            }

            if (player === 1) {
                scorePosition += isCorrect ? -1 : 1; 
            } else if (player === 2) {
                scorePosition += isCorrect ? 1 : -1;
            }

            updateArena();

            if (scorePosition <= -MAX_STEPS) {
                setTimeout(() => endGame(1), 400); 
            } else if (scorePosition >= MAX_STEPS) {
                setTimeout(() => endGame(2), 400);
            } else {
                setTimeout(loadNextQuestion, 250);
            }
        }

        function updateArena() {
            const tugGroup = document.getElementById('tug-group');
            const stepPercentage = 40 / MAX_STEPS; 
            const newLeft = 50 + (scorePosition * stepPercentage); 
            tugGroup.style.left = `${newLeft}%`;
        }

        function endGame(winner) {
            stopBGM();
            
            totalTimeElapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(totalTimeElapsed / 60);
            const seconds = totalTimeElapsed % 60;
            const timeFormatted = minutes > 0 ? `${minutes} menit ${seconds} detik` : `${seconds} detik`;

            switchScreen('result-screen');
            const resultMsg = document.getElementById('result-message');
            
            const winnerName = (winner === 1 ? p1Name : p2Name).toUpperCase();
            const winnerColor = winner === 1 ? "#3b82f6" : "#ef4444";

            resultMsg.innerHTML = `
                <div style="color: ${winnerColor}; text-shadow: 0 0 20px ${winnerColor}; margin-bottom: 12px;">🏁 ${winnerName} MENANG! 🏁</div>
                <div style="font-size: 16px; font-weight: 600; color: #cbd5e1; letter-spacing: 0.5px;">
                    ⏱️ Total Waktu Permainan: <span style="color: #f87171; font-weight: 700;">${timeFormatted}</span>
                </div>
            `;
        }

        function resetGame() {
            playSFX('click');
            if (currentData.length > 0) {
                initGameSession();
            } else {
                backToMenu();
            }
        }

        function backToMenu() {
            playSFX('click');
            stopBGM();
            switchScreen('menu-screen');
        }
    </script>
