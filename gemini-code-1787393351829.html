<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarik Tambang Kuda Kanji</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .screen { display: none; }
        .active { display: block; }

        h1 { color: #333; }

        /* Tombol Umum */
        .menu-btn {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .btn-n5 { background-color: #4CAF50; }
        .btn-n4 { background-color: #2196F3; }
        .btn-n3 { background-color: #f44336; }
        .btn-gray { background-color: #757575; }
        .btn-orange { background-color: #ff9800; }
        .menu-btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* Arena Tarik Tambang */
        #arena-container {
            width: 90%;
            max-width: 600px;
            height: 120px;
            margin: 30px auto;
            background: #e8f5e9;
            border: 3px solid #2e7d32;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .center-line {
            position: absolute;
            left: 50%;
            top: 0; bottom: 0;
            width: 4px;
            background: rgba(0,0,0,0.3);
            border-left: 2px dashed #fff;
            z-index: 1;
        }

        /* Grup Kuda dan Tali */
        #tug-group {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .rope {
            position: absolute;
            left: 40px; right: 40px;
            height: 6px;
            background-color: #8B4513;
            z-index: -1;
            box-shadow: 0 2px 2px rgba(0,0,0,0.3);
        }

        .horse {
            font-size: 35px;
            background: white;
            border-radius: 50%;
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .horse-red { border: 4px solid #ff4d4d; }
        .horse-blue { border: 4px solid #4d4dff; transform: scaleX(-1); }

        /* Kuis Container */
        #kanji-display {
            font-size: 80px;
            margin: 20px 0;
            font-weight: bold;
            color: #222;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .option-btn {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .option-btn:hover { background: #e3f2fd; border-color: #2196F3; }
        
        .meaning-text {
            font-size: 14px;
            color: #555;
            font-weight: normal;
        }

        .control-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        #result-message { font-size: 30px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- MENU SCREEN -->
    <div id="menu-screen" class="screen active">
        <h1>🐎 Tarik Tambang Kuda Kanji 🐎</h1>
        <p>Pilih level Kanji Anda. Jawab dengan benar untuk menarik musuh, jawab salah musuh yang menarik Anda!</p>
        <button class="menu-btn btn-n5" onclick="startGame('N5')">Main Level N5</button>
        <button class="menu-btn btn-n4" onclick="startGame('N4')">Main Level N4</button>
        <button class="menu-btn btn-n3" onclick="startGame('N3')">Main Level N3</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <h2 id="level-indicator">Level: --</h2>
        
        <div id="arena-container">
            <div class="center-line"></div>
            <div id="tug-group">
                <div class="horse horse-red">🐴</div>
                <div class="rope"></div>
                <div class="horse horse-blue">🐴</div>
            </div>
        </div>

        <div id="kanji-display">日</div>
        
        <div class="options-grid" id="options-container"></div>

        <div class="control-panel">
            <button class="menu-btn btn-gray" onclick="resetGame()">Reset</button>
            <button class="menu-btn btn-orange" onclick="backToMenu()">Selesai</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen">
        <div id="result-message"></div>
        <button class="menu-btn btn-n5" onclick="backToMenu()">Kembali ke Menu</button>
    </div>

            { kanji: '習', reading: 'シュウ / ならう', meaning: 'Belajar', level: 'N4' },
            { kanji: '乗', reading: 'ジョウ / のる', meaning: 'Naik (Kendaraan)', level: 'N4' },

            { kanji: '早', reading: 'ソウ / はやい', meaning: 'Cepat / Pagi', level: 'N4' },
            { kanji: '走', reading: 'ソウ / はしる', meaning: 'Lari', level: 'N4' },
            { kanji: '待', reading: 'タイ / まつ', meaning: 'Tunggu', level: 'N4' },
            { kanji: '朝', reading: 'チョウ / あさ', meaning: 'Pagi', level: 'N4' },
            { kanji: '昼', reading: 'チュウ / ひる', meaning: 'Siang', level: 'N4' },
            { kanji: '夜', reading: 'ヤ / よる', meaning: 'Malam', level: 'N4' },
            { kanji: '働', reading: 'ドウ / はたらく', meaning: 'Bekerja', level: 'N4' },
            { kanji: '病', reading: 'ビョウ', meaning: 'Sakit', level: 'N4' },
            { kanji: '勉', reading: 'ベン', meaning: 'Berusaha / Belajar Giat', level: 'N4' },
            { kanji: '歩', reading: 'ホ / あるく', meaning: 'Jalan', level: 'N4' },
            { kanji: '薬', reading: 'ヤク / くすり', meaning: 'Obat', level: 'N4' },

            // ================= LEVEL N3 (High Frequency) =================
            { kanji: '愛', reading: 'アイ / あいする', meaning: 'Cinta / Kasih sayang', level: 'N3' },
            { kanji: '案', reading: 'アン', meaning: 'Rencana / Ide / Usulan', level: 'N3' },

            { kanji: '守', reading: 'シュ / まもる', meaning: 'Melindungi / Menjaga', level: 'N3' },
            { kanji: '悲', reading: 'ヒ / かなしい', meaning: 'Sedih / Berduka', level: 'N3' },
            { kanji: '美', reading: 'ビ / うつくしい', meaning: 'Indah / Cantik / Elok', level: 'N3' },
            { kanji: '負', reading: 'フ / まける', meaning: 'Kalah / Memikul', level: 'N3' },
            { kanji: '初', reading: 'ショ / はじめ', meaning: 'Pertama kali / Awal', level: 'N3' },
            { kanji: '済', reading: 'サイ / すむ', meaning: 'Selesai / Melunasi', level: 'N3' },
            { kanji: '打', reading: 'ダ / うつ', meaning: 'Memukul / Mengetik', level: 'N3' },
            { kanji: '忘', reading: 'ボウ / わすれる', meaning: 'Lupa / Mengabaikan', level: 'N3' },
            { kanji: '忙', reading: 'ボウ / いそがしい', meaning: 'Sibuk', level: 'N3' },
            { kanji: '落', reading: 'ラク / おちる', meaning: 'Jatuh / Turun / Gagal', level: 'N3' },
            { kanji: '流', reading: 'リュウ / ながれる', meaning: 'Mengalir / Hanyut', level: 'N3' },
            { kanji: '両', reading: 'リョウ', meaning: 'Kedua Belah Sisi', level: 'N3' },
            { kanji: '冷', reading: 'レイ / つめたい', meaning: 'Dingin (Benda)', level: 'N3' },
            { kanji: '恋', reading: 'レン / こい', meaning: 'Cinta Romantis / Asmara', level: 'N3' },
            { kanji: '練', reading: 'レン / ねる', meaning: 'Melatih / Mengembangkan', level: 'N3' },
            { kanji: '連', reading: 'レン / つれる', meaning: 'Membawa / Hubung', level: 'N3' }
        ];

        let currentData = [];
        let currentQuestion = null;
        let scorePosition = 0; 

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame(level) {
            currentData = kanjiDatabase.filter(k => k.level === level);
            document.getElementById('level-indicator').innerText = `Level: ${level} (Kuda Merah vs Kuda Biru)`;
            
            scorePosition = 0;
            updateArena();

            switchScreen('game-screen');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            const correctIndex = Math.floor(Math.random() * currentData.length);
            currentQuestion = currentData[correctIndex];

            let wrongOptions = currentData.filter((_, idx) => idx !== correctIndex);
            wrongOptions.sort(() => 0.5 - Math.random()); 
            wrongOptions = wrongOptions.slice(0, 3);

            let allOptions = [currentQuestion, ...wrongOptions];
            allOptions.sort(() => 0.5 - Math.random());

            document.getElementById('kanji-display').innerText = currentQuestion.kanji;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            allOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${opt.reading}</span><span class="meaning-text">(${opt.meaning})</span>`;
                btn.onclick = () => checkAnswer(opt.kanji);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedKanji) {
            if (selectedKanji === currentQuestion.kanji) {
                scorePosition += 1; 
            } else {
                scorePosition -= 1;
            }

            updateArena();

            if (scorePosition >= 4) {
                setTimeout(() => endGame(true), 300); 
            } else if (scorePosition <= -4) {
                setTimeout(() => endGame(false), 300);
            } else {
                loadNextQuestion();
            }
        }

        function updateArena() {
            const tugGroup = document.getElementById('tug-group');
            const newLeft = 50 - (scorePosition * 8); 
            tugGroup.style.left = `${newLeft}%`;
        }

        function endGame(isWin) {
            switchScreen('result-screen');
            const resultMsg = document.getElementById('result-message');
            if (isWin) {
                resultMsg.innerText = "🎉 Kamu Menang! Kudamu berhasil menarik musuh! 🎉";
                resultMsg.style.color = "#4CAF50";
            } else {
                resultMsg.innerText = "💥 Kamu Kalah! Kudamu terseret oleh musuh! 💥";
                resultMsg.style.color = "#f44336";
            }
        }

        function resetGame() {
            if (currentData.length > 0) {
                startGame(currentData[0].level);
            }
        }

        function backToMenu() {
            switchScreen('menu-screen');
        }
    </script>
</body>
</html>
